name: gVisor storage qualification

on:
  pull_request:
    paths:
      - 'deploy/runtime/gvisor/**'
      - 'scripts/e2e/gvisor-sync/**'
      - '.github/workflows/gvisor-storage.yml'
  push:
    branches: [dev]
    paths:
      - 'deploy/runtime/gvisor/**'
      - 'scripts/e2e/gvisor-sync/**'
      - '.github/workflows/gvisor-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-errors:
    name: Host sync error propagation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GVISOR_QUALIFICATION_ROOT: /tmp/moss-gvisor-${{ github.run_id }}-${{ github.run_attempt }}
      GVISOR_INSTALL_ROOT: /tmp/moss-gvisor-installed-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and host installation contracts
        run: python3 -m unittest discover -s deploy/runtime/gvisor -p 'test_*.py' -v
      - name: Prepare isolated qualification directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0755 "$GVISOR_QUALIFICATION_ROOT"
          mkdir -m 0755 "$GVISOR_QUALIFICATION_ROOT/source" "$GVISOR_QUALIFICATION_ROOT/output"
          mkdir -m 0700 "$RUNNER_TEMP/gvisor-workspaces"
      - name: Resolve the pinned Nexus storage suite
        id: nexus
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          lock = json.loads(Path('scripts/e2e/gvisor-sync/nexus-source.lock.json').read_text())
          assert lock['repository'] == 'nexi-lab/nexus-vfs'
          assert re.fullmatch('[0-9a-f]{40}', lock['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + lock['repository'] + '\nrevision=' + lock['revision'] + '\n')
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.nexus.outputs.repository }}
          ref: ${{ steps.nexus.outputs.revision }}
          path: nexus-storage-source
      - name: Install the Nexus-pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("nexus-storage-source/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$toolchain" --profile minimal
      - uses: ./nexus-storage-source/.github/actions/setup-protoc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nexus-storage-target
          key: gvisor-nexus-${{ runner.os }}-${{ hashFiles('scripts/e2e/gvisor-sync/nexus-source.lock.json') }}
          restore-keys: gvisor-nexus-${{ runner.os }}-
      - name: Build the real Nexus database and CAS suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/e2e/gvisor-sync/build_storage.py \
            --source="$PWD/nexus-storage-source" --target="$RUNNER_TEMP/nexus-storage-target" \
            --output="$GVISOR_QUALIFICATION_ROOT/output/nexus-payload"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gvisor-cache
          key: gvisor-bazel-${{ runner.os }}-${{ hashFiles('deploy/runtime/gvisor/runtime.lock.json') }}
          restore-keys: gvisor-bazel-${{ runner.os }}-
      - name: Build the pinned toolchain image
        run: docker build -t moss-gvisor-builder deploy/runtime/gvisor
      - name: Build and qualify upstream and the candidate
        shell: bash
        run: |
          set -euo pipefail
          task_root="$GVISOR_QUALIFICATION_ROOT"
          mkdir -p "$task_root/source" "$task_root/output" "$RUNNER_TEMP/gvisor-cache"
          for mode in baseline candidate; do
            build_args=()
            expected=propagated
            if [ "$mode" = baseline ]; then
              build_args+=(--baseline)
              expected=lost
            fi
            docker run --rm --cpus=1 --memory=3g \
              --mount "type=bind,source=$PWD,target=/recipe,readonly" \
              --mount "type=bind,source=$task_root/source,target=/work" \
              --mount "type=bind,source=$task_root/output,target=/output" \
              --mount "type=bind,source=$RUNNER_TEMP/gvisor-cache,target=/cache" \
              moss-gvisor-builder python3 /recipe/deploy/runtime/gvisor/build.py \
              --workspace=/work --output="/output/$mode" --cache=/cache "${build_args[@]}"
            runtime="$task_root/output/$mode/release/runsc"
            manifest="$task_root/output/$mode/release/manifest.json"
            sha256="$(sha256sum "$manifest" | cut -d' ' -f1)"
            if [ "$mode" = candidate ]; then
              python3 deploy/runtime/gvisor/package.py build \
                --build="$task_root/output/candidate" --source="$task_root/source" \
                --output="$task_root/output/distribution"
              archive_sha="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["archiveSha256"])' "$task_root/output/distribution/release.json")"
              python3 scripts/e2e/gvisor-sync/acquisition.py \
                --distribution="$task_root/output/distribution" \
                --cache="$RUNNER_TEMP/gvisor-workspaces/acquisition-cache" \
                --results="$task_root/output/acquisition-qualification"
              acquired_archive="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["archivePath"])' "$task_root/output/acquisition-qualification/receipt.json")"
              sudo python3 deploy/runtime/gvisor/install.py stage \
                --archive="$acquired_archive" --sha256="$archive_sha" \
                --manifest-sha256="$sha256" --prefix="$GVISOR_INSTALL_ROOT" \
                > "$task_root/output/installation.json"
              runtime="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["runsc"])' "$task_root/output/installation.json")"
              manifest="$(dirname "$runtime")/manifest.json"
            fi
            sudo python3 scripts/e2e/gvisor-sync/qualify.py \
              --runtime="$runtime" --manifest="$manifest" --sha256="$sha256" \
              --results="$task_root/output/$mode-qualification" --expect="$expected" \
              --work-dir="$RUNNER_TEMP/gvisor-workspaces/$mode"
            if [ "$mode" = candidate ]; then
              payload="$task_root/output/nexus-payload/manifest.json"
              payload_sha256="$(sha256sum "$payload" | cut -d' ' -f1)"
              sudo python3 scripts/e2e/gvisor-sync/nexus_storage.py \
                --runtime="$runtime" --manifest="$manifest" --sha256="$sha256" \
                --payload="$payload" --payload-sha256="$payload_sha256" \
                --results="$task_root/output/nexus-qualification" \
                --work-dir="$RUNNER_TEMP/gvisor-workspaces/nexus"
              sudo python3 scripts/e2e/gvisor-sync/containerd.py \
                --installed="$(dirname "$(dirname "$runtime")")" --manifest-sha256="$sha256" \
                --results="$task_root/output/shim-qualification" \
                --work-dir="$RUNNER_TEMP/gvisor-workspaces/shim"
              python3 deploy/runtime/gvisor/package.py qualify \
                --distribution="$task_root/output/distribution" \
                --installation="$task_root/output/installation.json" \
                --syscalls="$task_root/output/candidate-qualification/receipt.json" \
                --storage="$task_root/output/nexus-qualification/receipt.json" \
                --shim="$task_root/output/shim-qualification/receipt.json" \
                --revision="$(git rev-parse HEAD)"
            fi
          done
      - name: Make the owned cache readable for artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "$RUNNER_TEMP/gvisor-cache" "$GVISOR_QUALIFICATION_ROOT/output"; do
            if [ -d "$path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvisor-storage-qualification
          path: ${{ env.GVISOR_QUALIFICATION_ROOT }}/output
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gvisor-release-candidate
          path: ${{ env.GVISOR_QUALIFICATION_ROOT }}/output/distribution
          retention-days: 14
          if-no-files-found: error
