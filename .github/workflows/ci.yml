name: CI

on:
  push:
    tags:
      - 'v*'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install admin dependencies
        run: bun install
        working-directory: admin

      - name: Build parent JS files
        run: bun run build:node

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: bun install
        working-directory: ui

      - name: TypeScript type check
        run: bun run check
        working-directory: ui

  build-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install admin dependencies
        run: bun install
        working-directory: admin

      - name: Build parent JS files
        run: bun run build:node

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: bun install
        working-directory: ui

      - name: Create build resources directory
        run: 'node -e "require(''node:fs'').mkdirSync(''ui/build'', { recursive: true })"'

      - name: Build renderer
        run: bun run build:renderer
        working-directory: ui

      - name: Upload renderer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: renderer-build
          path: ui/dist/renderer
          retention-days: 7

  build-mac:
    runs-on: macos-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install admin dependencies
        run: bun install
        working-directory: admin

      - name: Build parent JS files
        run: bun run build:node

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: bun install
        working-directory: ui

      - name: Create build resources directory
        run: 'node -e "require(''node:fs'').mkdirSync(''ui/build'', { recursive: true })"'

      - name: Build macOS installer
        run: bun run dist:mac
        working-directory: ui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: ui/dist/installers
          retention-days: 7

  build-win:
    runs-on: windows-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install admin dependencies
        run: bun install
        working-directory: admin

      - name: Build parent JS files
        run: bun run build:node

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install UI dependencies
        run: bun install
        working-directory: ui

      - name: Create build resources directory
        run: 'node -e "require(''node:fs'').mkdirSync(''ui/build'', { recursive: true })"'

      - name: Build Windows installer
        run: bun run dist:win
        working-directory: ui

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: ui/dist/installers
          retention-days: 7
