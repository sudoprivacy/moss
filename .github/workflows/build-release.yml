name: Build Moss Server Release

on:
  push:
    branches:
      - dev
    tags:
      - 'server-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout moss
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#server-v}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
            RELEASE_TAG="server-v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          SCODE_VERSION="$(node -p "require('./src/server/nexus/runtime-versions.json').scode")"
          SCODE_BUNDLE_SHA256="$(node -p "require('./src/server/nexus/runtime-versions.json')['scode-linux-x64-bundle-sha256']")"
          [[ "$SCODE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SCODE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$VERSION-amd64" >> "$GITHUB_OUTPUT"
          echo "scode_version=$SCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Stage sudocode source for nexus-napi
        uses: actions/checkout@v5
        with:
          repository: sudoprivacy/sudocode
          path: .sudocode-build-context
          token: ${{ secrets.SUDOCODE_REPO_TOKEN || github.token }}

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/package-server.sh
          bash -n scripts/publish-server-to-cos.sh
          bash -n scripts/e2e/run-server-release-smoke.sh
          node --check scripts/e2e/mock-openai-server.mjs
          node --check scripts/e2e/server-release-smoke.mjs
          node --check scripts/e2e/server-admin-browser-smoke.mjs
          chmod +x deploy/install.sh deploy/package-server.sh scripts/publish-server-to-cos.sh \
            scripts/e2e/mock-openai-server.mjs scripts/e2e/server-release-smoke.mjs \
            scripts/e2e/server-admin-browser-smoke.mjs \
            scripts/e2e/run-server-release-smoke.sh
          cos_help_output="$(scripts/publish-server-to-cos.sh --help)"
          grep -Fq 'Usage: publish-server-to-cos.sh' <<< "$cos_help_output"
          grep -Fq -- '--release-only' <<< "$cos_help_output"
          grep -Fq -- '--latest-only' <<< "$cos_help_output"
          help_output="$(MOSS_RELEASE_TAG=server-vtest bash -s -- --help < deploy/install.sh 2>&1)"
          grep -Fq 'Usage: install.sh' <<< "$help_output"
          grep -Fq -- '--download PATH' <<< "$help_output"
          ! grep -Fq 'unbound variable' <<< "$help_output"
          download_dir="$(mktemp -d)"
          download_output="$(MOSS_RELEASE_TAG=server-vtest MOSS_DOWNLOAD_BASE=http://127.0.0.1:9 \
            deploy/install.sh --download "$download_dir" 2>&1 || true)"
          grep -Fq '[moss-install] Downloading [1/4] install.sh' <<< "$download_output"
          ! grep -Fq 'run as root' <<< "$download_output"
          rm -rf "$download_dir"
          offline_output="$(sudo env SUDO_USER="$USER" MOSS_RELEASE_TAG=server-vtest MOSS_NON_INTERACTIVE=1 \
            bash -s -- --offline < deploy/install.sh 2>&1 || true)"
          install_home="$(getent passwd "$USER" | awk -F: 'NR == 1 { print $6 }')"
          grep -Fq "[moss-install] Service user: $USER" <<< "$offline_output"
          grep -Fq "[moss-install] Install directory: $install_home/.moss/server" <<< "$offline_output"
          grep -Fq -- '--offline must be run from the unpacked install.sh file' <<< "$offline_output"
          ! grep -Fq 'unbound variable' <<< "$offline_output"

      - name: Build host server package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: amd64
        run: deploy/package-server.sh "$VERSION" "$ARCH" dist

      - name: Build and smoke-test session runtime image
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          SCODE_VERSION: ${{ steps.release.outputs.scode_version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "my-moss-runtime:$IMAGE_TAG" \
            -f deploy/runtime/Dockerfile .
          docker run --rm "my-moss-runtime:$IMAGE_TAG" scode --version 2>&1 | tee dist/scode-version.txt
          grep -Fq "${SCODE_VERSION#v}" dist/scode-version.txt
          docker save "my-moss-runtime:$IMAGE_TAG" | gzip -1 > "dist/moss-runtime-${{ steps.release.outputs.version }}-linux-amd64.tar.gz"

      - name: Assemble installer and checksums
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: amd64
        run: |
          set -euo pipefail
          sed "s/@@MOSS_RELEASE_TAG@@/$RELEASE_TAG/g" deploy/install.sh > dist/install.sh
          chmod +x dist/install.sh
          SERVER_ARCHIVE="moss-server-$VERSION-linux-$ARCH.tar.gz"
          RUNTIME_ARCHIVE="moss-runtime-$VERSION-linux-$ARCH.tar.gz"
          (
            cd dist
            sha256sum "$SERVER_ARCHIVE" "$RUNTIME_ARCHIVE" > "SHA256SUMS-$ARCH"
          )

      - name: Validate release contents
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: amd64
        run: |
          set -euo pipefail
          tar -tzf "dist/moss-server-$VERSION-linux-$ARCH.tar.gz" > dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/moss-server.mjs' dist/server-contents.txt
          grep -Fxq 'moss-server/node/bin/node' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/nexus/nexusd' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/scode' dist/server-contents.txt
          package_check_dir="$(mktemp -d)"
          tar -xzf "dist/moss-server-$VERSION-linux-$ARCH.tar.gz" -C "$package_check_dir"
          test -x "$package_check_dir/moss-server/app/bin/scode"
          rm -rf "$package_check_dir"
          ! grep -q '@@MOSS_RELEASE_TAG@@' dist/install.sh
          EXPECTED_RELEASE_LINE="$(printf 'RELEASE_TAG="${MOSS_RELEASE_TAG:-%s}"' "server-v$VERSION")"
          grep -Fq "$EXPECTED_RELEASE_LINE" dist/install.sh
          ! grep -Fq 'api.github.com/repos' dist/install.sh
          grep -Fq 'Offline files are ready' dist/install.sh
          grep -Fq 'sudo systemctl start' dist/install.sh
          grep -Fq 'sudo systemctl stop' dist/install.sh
          grep -Fq 'sudo systemctl restart' dist/install.sh
          grep -Fq -- '--upgrade' dist/install.sh
          grep -Fq 'already installed; no downloads needed' dist/install.sh
          grep -Fq 'packages/$RELEASE_TAG' dist/install.sh
          grep -Fq -- '--progress-bar' dist/install.sh
          grep -Fq 'sudowork-release-1309794936.cos.accelerate.myqcloud.com/moss/server/releases/$RELEASE_TAG' dist/install.sh

      - name: Run packaged Server E2E smoke
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: amd64
          SCODE_VERSION: ${{ steps.release.outputs.scode_version }}
        run: |
          scripts/e2e/run-server-release-smoke.sh \
            "$VERSION" "$ARCH" dist "$RUNNER_TEMP/moss-server-e2e" "$SCODE_VERSION"

      - name: Upload Server E2E diagnostics
        id: server_e2e_diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moss-server-e2e-${{ steps.release.outputs.version }}-amd64
          path: ${{ runner.temp }}/moss-server-e2e/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Server E2E evidence summary
        if: always()
        shell: bash
        env:
          E2E_ARTIFACT_URL: ${{ steps.server_e2e_diagnostics.outputs.artifact-url }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/moss-server-e2e/ci-summary.md"
          {
            echo '## Moss Server packaged E2E'
            echo
            if [[ -f "$REPORT" ]]; then
              cat "$REPORT"
            else
              echo '❌ E2E 未完整通过；请查看诊断 artifact 中的日志与失败页面截图。'
            fi
            echo
            if [[ -n "$E2E_ARTIFACT_URL" ]]; then
              echo "[下载浏览器截图与完整诊断]($E2E_ARTIFACT_URL)"
            else
              echo '诊断 artifact 未成功上传。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload architecture assets
        uses: actions/upload-artifact@v5
        with:
          name: moss-server-release-amd64
          path: |
            dist/moss-server-${{ steps.release.outputs.version }}-linux-amd64.tar.gz
            dist/moss-runtime-${{ steps.release.outputs.version }}-linux-amd64.tar.gz
            dist/SHA256SUMS-amd64
            dist/install.sh
            dist/moss-server-e2e-evidence-${{ steps.release.outputs.version }}-amd64.tar.gz
            dist/moss-server-e2e-evidence-${{ steps.release.outputs.version }}-amd64.tar.gz.sha256
            dist/moss-server-e2e-report-${{ steps.release.outputs.version }}-amd64.md
            dist/moss-server-e2e-*-${{ steps.release.outputs.version }}-amd64.png
          retention-days: 30

  release:
    name: publish-server-release
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout moss
        uses: actions/checkout@v5

      - name: Download build assets
        uses: actions/download-artifact@v5
        with:
          pattern: moss-server-release-*
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'moss-server-e2e-*.md' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'moss-server-e2e-*.png' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'moss-server-e2e-*.sha256' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'SHA256SUMS-*' -exec cat {} \; | sort -k2 > release-assets/SHA256SUMS
          cp "$(find artifacts -type f -name install.sh -print -quit)" release-assets/install.sh
          chmod +x release-assets/install.sh
          (cd release-assets && sha256sum -c SHA256SUMS)
          ls -lh release-assets

      - name: Upload immutable release to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: sudowork-release-1309794936
          COS_ROOT_PATH: moss/server
          COS_PUBLIC_BASE_URL: https://sudowork-release-1309794936.cos.accelerate.myqcloud.com
        run: |
          set -euo pipefail
          [ -n "$TENCENT_SECRET_ID" ] || { echo 'TENCENT_SECRET_ID is not configured'; exit 1; }
          [ -n "$TENCENT_SECRET_KEY" ] || { echo 'TENCENT_SECRET_KEY is not configured'; exit 1; }
          pip install coscmd==1.9.0.6
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" \
            -b "$COS_BUCKET" -e cos.accelerate.myqcloud.com
          bash scripts/publish-server-to-cos.sh release-assets "$GITHUB_REF_NAME" --release-only

      - name: Publish server release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/*.tar.gz
            release-assets/install.sh
            release-assets/SHA256SUMS
            release-assets/moss-server-e2e-*.md
            release-assets/moss-server-e2e-*.png
            release-assets/moss-server-e2e-*.sha256

      - name: Publish Tencent COS Latest entrypoint
        env:
          COS_BUCKET: sudowork-release-1309794936
          COS_ROOT_PATH: moss/server
          COS_PUBLIC_BASE_URL: https://sudowork-release-1309794936.cos.accelerate.myqcloud.com
        run: bash scripts/publish-server-to-cos.sh release-assets "$GITHUB_REF_NAME" --latest-only
