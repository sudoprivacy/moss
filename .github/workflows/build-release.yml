# ---------------------------------------------------------
# Moss Release Package Builder
# 触发条件:
#   - dev 分支推送
#   - 手动触发 (可指定 scode 版本)
#   - tag 推送 (创建 GitHub Release)
#
# 产出物:
#   - moss-deploy-{commit8}.tar.gz
#   包含:
#     - my-moss-runtime-{tag}.tar.gz (会话容器镜像)
#     - my-moss-server-{tag}.tar.gz (主服务镜像)
#     - server.json
#     - docker-compose.yml
#     - start.sh
#     - shutdown.sh
# ---------------------------------------------------------

name: Build Moss Release Package

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      scode_version:
        description: 'scode release version (e.g., v0.1.0)'
        required: false
        default: 'latest'

env:
  BUN_VERSION: '1.3'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置镜像 tag (git commit 前 8 位)
      - name: Set image tag
        id: tag
        run: |
          TAG=$(echo $GITHUB_SHA | cut -c1-8)
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      # 2. 安装 Bun 并构建 (build:node 已包含前端构建)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Dependencies
        run: |
          bun install
          cd admin && bun install && cd ..

      - name: Build All (Backend + Frontend)
        run: bun run build:node

      # 3. 下载 scode
      - name: Get scode version
        id: scode-version
        run: |
          if [ "${{ github.event.inputs.scode_version }}" != "" ] && [ "${{ github.event.inputs.scode_version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.scode_version }}"
          else
            VERSION=$(curl -sI "https://github.com/sudoprivacy/sudocode/releases/latest" | grep -i "location:" | sed 's/.*tag\///' | tr -d '\r\n')
            if [ -z "$VERSION" ]; then
              VERSION=$(curl -s https://api.github.com/repos/sudoprivacy/sudocode/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
            fi
          fi
          echo "Detected scode version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download scode
        env:
          SCODE_VERSION: ${{ steps.scode-version.outputs.version }}
        run: |
          echo "Downloading scode $SCODE_VERSION for linux-x64"

          DOWNLOAD_URL="https://github.com/sudoprivacy/sudocode/releases/download/$SCODE_VERSION/scode-linux-x64.tar.gz"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o scode.tar.gz "$DOWNLOAD_URL"

          tar -xzf scode.tar.gz
          mv scode-linux-x64/scode bin/scode
          chmod +x bin/scode
          rm -rf scode-linux-x64 scode.tar.gz

          echo "scode ready: $(ls -la bin/scode)"

      # 4. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建 Runtime 镜像 (会话容器)
      - name: Build Runtime Docker Image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          echo "Building runtime image with tag: $IMAGE_TAG"
          docker build -t my-moss-runtime:$IMAGE_TAG -f deploy/runtime/Dockerfile .
          docker save my-moss-runtime:$IMAGE_TAG | gzip > my-moss-runtime-$IMAGE_TAG.tar.gz
          echo "Runtime image size: $(ls -lh my-moss-runtime-$IMAGE_TAG.tar.gz)"

      # 6. 构建 Server 镜像 (主服务)
      - name: Build Server Docker Image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          echo "Building server image with tag: $IMAGE_TAG"
          docker build -t my-moss-server:$IMAGE_TAG -f deploy/server.Dockerfile .
          docker save my-moss-server:$IMAGE_TAG | gzip > my-moss-server-$IMAGE_TAG.tar.gz
          echo "Server image size: $(ls -lh my-moss-server-$IMAGE_TAG.tar.gz)"

      # 7. 组装部署包
      - name: Assemble Release Package
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          mkdir -p release/moss

          # 复制镜像文件
          cp my-moss-runtime-$IMAGE_TAG.tar.gz release/moss/
          cp my-moss-server-$IMAGE_TAG.tar.gz release/moss/

          # 复制配置文件，并更新镜像 tag
          cp deploy/server.json release/moss/
          sed -i "s/my-moss-runtime:v1/my-moss-runtime:$IMAGE_TAG/g" release/moss/server.json
          cp deploy/docker-compose.yml release/moss/

          # 复制启动脚本
          cp deploy/start.sh release/moss/
          cp deploy/shutdown.sh release/moss/
          chmod +x release/moss/start.sh
          chmod +x release/moss/shutdown.sh

          # 复制说明文档
          cp deploy/README.md release/moss/

          # 打包
          cd release
          tar -czvf ../moss-deploy-$IMAGE_TAG.tar.gz moss
          cd ..

          echo "Package ready: $(ls -lh moss-deploy-$IMAGE_TAG.tar.gz)"
          echo "Package contents:"
          tar -tzvf moss-deploy-$IMAGE_TAG.tar.gz
          echo ""
          echo "server.json dockerImage config:"
          grep "dockerImage" release/moss/server.json

      # 8. 上传构建产物
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moss-deploy-${{ steps.tag.outputs.IMAGE_TAG }}
          path: moss-deploy-*.tar.gz
          retention-days: 30

  # 创建 GitHub Release（当打 tag 时）
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/moss-*.tar.gz
          generate_release_notes: true
