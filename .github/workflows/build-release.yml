# ---------------------------------------------------------
# Moss Release Package Builder
# 触发条件:
#   - dev 分支推送
#   - 手动触发 (可指定 scode 版本)
#   - tag 推送 (创建 GitHub Release)
#
# 产出物:
#   - moss-linux-x64-{version}.tar.gz
#   - moss-macos-arm64-{version}.tar.gz
# ---------------------------------------------------------

name: Build Moss Release Package

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      scode_version:
        description: 'scode release version (e.g., v0.1.0)'
        required: false
        default: 'latest'

env:
  BUN_VERSION: '1.3'
  NODE_VERSION: '24.15.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装 Bun 并构建 (build:node 已包含前端构建)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Dependencies
        run: |
          bun install
          cd admin && bun install && cd ..

      - name: Build All (Backend + Frontend)
        run: bun run build:node

      # 2. 下载 scode
      - name: Get scode version
        id: scode-version
        run: |
          if [ "${{ github.event.inputs.scode_version }}" != "" ] && [ "${{ github.event.inputs.scode_version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.scode_version }}"
          else
            VERSION=$(curl -sI "https://github.com/sudoprivacy/sudocode/releases/latest" | grep -i "location:" | sed 's/.*tag\///' | tr -d '\r\n')
            if [ -z "$VERSION" ]; then
              VERSION=$(curl -s https://api.github.com/repos/sudoprivacy/sudocode/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
            fi
          fi
          echo "Detected scode version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download scode
        env:
          SCODE_VERSION: ${{ steps.scode-version.outputs.version }}
        run: |
          echo "Downloading scode $SCODE_VERSION for linux-x64"

          DOWNLOAD_URL="https://github.com/sudoprivacy/sudocode/releases/download/$SCODE_VERSION/scode-linux-x64.tar.gz"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o scode.tar.gz "$DOWNLOAD_URL"

          tar -xzf scode.tar.gz
          mv scode-linux-x64/scode bin/scode
          chmod +x bin/scode
          rm -rf scode-linux-x64 scode.tar.gz

          echo "scode ready: $(ls -la bin/scode)"

      # 2.5. 下载 Nexus
      - name: Download Nexus
        run: |
          NEXUS_VERSION="0.9.43"
          echo "Downloading Nexus $NEXUS_VERSION for linux-x64"

          DOWNLOAD_URL="https://github.com/nexi-lab/nexus/releases/download/v${NEXUS_VERSION}/nexus-cluster-linux-x86_64.tar.gz"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o nexus.tar.gz "$DOWNLOAD_URL"

          mkdir -p nexus-bin
          tar -xzf nexus.tar.gz -C nexus-bin

          # Find nexusd binary in extracted archive
          NEXUSD=$(find nexus-bin -name "nexusd" -type f | head -1)
          if [ -z "$NEXUSD" ]; then
            echo "ERROR: nexusd not found in archive"
            ls -la nexus-bin/
            exit 1
          fi

          mkdir -p bin/nexus
          cp "$NEXUSD" bin/nexus/nexusd
          chmod +x bin/nexus/nexusd

          # Copy _internal directory if exists (Python runtime)
          INTERNAL_DIR=$(find nexus-bin -type d -name "_internal" | head -1)
          if [ -n "$INTERNAL_DIR" ]; then
            cp -r "$INTERNAL_DIR" bin/nexus/_internal
            echo "Copied _internal directory"
          fi

          rm -rf nexus-bin nexus.tar.gz
          echo "Nexus ready: $(ls -la bin/nexus/)"

      # 3. 构建 Docker 镜像
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t my-moss-runtime:v1 -f deploy/runtime/Dockerfile .
          docker save my-moss-runtime:v1 | gzip > my-moss-runtime.tar.gz
          echo "Docker image size: $(ls -lh my-moss-runtime.tar.gz)"

      # 4. 下载 Node.js 运行时
      - name: Download Node.js Runtime
        run: |
          curl -LO https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-linux-x64.tar.xz

      # 5. 组装部署包
      - name: Assemble Release Package
        run: |
          mkdir -p release/moss/admin/dist
          mkdir -p release/moss/bin

          cp -r admin/dist/* release/moss/admin/dist/
          cp -r bin/* release/moss/bin/

          cp deploy/server.json release/moss/
          cp start.sh release/moss/
          cp shutdown.sh release/moss/
          cp deploy/runtime/Dockerfile release/moss/
          cp my-moss-runtime.tar.gz release/moss/
          cp node-v${{ env.NODE_VERSION }}-linux-x64.tar.xz release/moss/

          chmod +x release/moss/start.sh
          chmod +x release/moss/shutdown.sh
          chmod +x release/moss/bin/scode

          VERSION="${GITHUB_SHA:0:7}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi

          cd release
          tar -czvf ../moss-linux-x64-${VERSION}.tar.gz moss
          cd ..

          echo "Package ready: $(ls -lh moss-linux-x64-*.tar.gz)"

      # 6. 上传构建产物
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moss-linux-x64-${{ github.sha }}
          path: moss-linux-x64-*.tar.gz
          retention-days: 30

  # 创建 GitHub Release（当打 tag 时）
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/moss-*.tar.gz
          generate_release_notes: true
