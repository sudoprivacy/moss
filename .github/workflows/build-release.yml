name: Build Moss Server Release

on:
  push:
    branches:
      - dev
    tags:
      - 'server-v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The server suite runs under two runners because it has to: files reaching
  # AuthCenterDb need node:sqlite, which Bun does not implement. scripts/test-server.js
  # owns that split and fails on any test file it does not account for.
  #
  # Lives here rather than in ci.yml because ci.yml triggers only on v* tags —
  # nothing in it has ever run against a pull request.
  test:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: server-tests
    runs-on: ubuntu-24.04
    env:
      MOSS_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout moss
        uses: actions/checkout@v5
        with:
          # Matches the build job: `bun install` runs a postinstall that copies
          # vendor/ (native modules included) and exits non-zero if any is absent.
          lfs: true

      - name: Start PostgreSQL for acceptance
        uses: ./.github/actions/start-postgres

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Install dependencies
        run: bun install

      - name: Lint server and node tests
        run: bun run lint

      # Z-1: the PG suite's only switch is `{ skip: !MOSS_PG_TEST_URL }`
      # (pgBackend.test.ts). Without this gate an env rename/removal would
      # silently skip every PG case and the job would stay green.
      - name: Require real PostgreSQL for the server suite
        run: test -n "$MOSS_PG_TEST_URL"

      - name: Run server tests
        run: bun run test

      - name: Verify external provider concurrency on real PostgreSQL
        run: node --import tsx --test src/server/externalProviders/externalProviders.pg-test.ts src/server/identity/*.pg-test.ts src/server/agentFederation/*.pg-test.ts src/server/agentFederation/provider/*.pg-test.ts

      # Runtime acceptance entrypoints share the installed SDK and production types.
      - name: Keep the live e2e scripts compiling
        run: |
          node node_modules/typescript/bin/tsc --noEmit --module nodenext --resolveJsonModule \
            --moduleResolution nodenext --target es2022 --skipLibCheck \
            scripts/e2e/session-owner-live.ts scripts/e2e/run-session-owner-live.ts \
            scripts/e2e/node-issuer-live.ts scripts/e2e/run-user-pod-live.ts \
            scripts/e2e/cohost-two-sessions.ts \
            scripts/e2e/cohost-session-recovery.ts \
            scripts/e2e/cohost-real-model-workflow.ts scripts/e2e/cohost-model-bootstrap.ts \
            scripts/e2e/cohost-owner-keys.ts scripts/e2e/user-pod-runtime.ts \
            scripts/e2e/user-pod-recovery.ts scripts/e2e/user-pod-release-upgrade.ts \
            scripts/e2e/qualify-terminal-user-runtime.ts \
            scripts/e2e/server-session-live.ts \
            scripts/e2e/embedded-nexus-live.ts scripts/e2e/broker-upgrade-live.ts scripts/e2e/external-broker-live.ts

      # Nothing in this repo has ever type-checked: bun executes TypeScript
      # without checking it, and the release artifact is produced by `bun build`,
      # a bundler. A wrong-arity call therefore reaches dev under a fully green
      # suite — that happened in September and was caught only by an out-of-band
      # compile. This job runs on pull_request, on push to dev, and on server-v*
      # tags, so the same check guards the PR and the release build.
      #
      # It is a ratchet, not a wall: the tree carries ~1500 type errors, so the
      # gate counts only src/server (the code that ships) and fails when that
      # count rises above the committed baseline.
      - name: Typecheck ratchet (src/server)
        run: bun run typecheck

      - name: Install admin dependencies
        working-directory: admin
        run: bun install --frozen-lockfile

      - name: Check admin types and settings regressions
        working-directory: admin
        run: |
          bun run check
          bun run test:settings
          bun run test:organizations
          bun run test:moss-access
          bun run test:moss-im
          bun run test:auth

  runtime-live:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Installed Nexus runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: bun install --frozen-lockfile
      - name: Verify pinned contract bytes on every runtime platform
        run: node --test scripts/contracts/nexus-prewrite-source.test.mjs scripts/contracts/registry-source.test.mjs
      - name: Install checksum-verified runtime
        run: bun scripts/fetch-nexus-runtime.js
      - name: Bundle as production Node code
        run: bun build --target=node scripts/e2e/embedded-nexus-live.ts --outfile bin/embedded-nexus-live.mjs
      - name: Verify real startup and vault persistence across restart
        run: node bin/embedded-nexus-live.mjs
        env:
          MOSS_NEXUS_LIVE_ARTIFACTS: ${{ runner.temp }}/moss-runtime-evidence
      - name: Verify authenticated session ownership on a real isolated daemon
        shell: bash
        run: |
          set -euo pipefail
          bun build --target=node scripts/e2e/session-owner-live.ts --outfile bin/session-owner-live.mjs
          bun build --target=node scripts/e2e/run-session-owner-live.ts --outfile bin/run-session-owner-live.mjs
          binary="$PWD/bin/nexus/nexusd"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          node bin/run-session-owner-live.mjs "$binary" "$PWD/bin/session-owner-live.mjs"
        env:
          MOSS_NEXUS_LIVE_ARTIFACTS: ${{ runner.temp }}/moss-runtime-evidence
      - name: Verify production issuer bootstrap and signed owner credentials
        shell: bash
        run: |
          set -euo pipefail
          bun build --target=node scripts/e2e/node-issuer-live.ts --outfile bin/node-issuer-live.mjs
          binary="$PWD/bin/nexus/nexusd"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          node bin/node-issuer-live.mjs "$binary"
        env:
          MOSS_NEXUS_LIVE_ARTIFACTS: ${{ runner.temp }}/moss-runtime-evidence
      - name: Verify upgrade and rollback from the deployed broker baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/nexus-previous-runtime"
          mkdir -p "$OLD"
          export OLD
          node --input-type=module <<'NODE'
          import { downloadWithFallback } from './scripts/fetch-nexus-runtime.js'
          const artifacts = [
            { file: 'runtime.tar.gz', sha: '696e26a86862096f800bdd0464aa0a83e572bac54f47e92ef0113216ebfb1eed',
              path: 'nexus-vfs/release/v0.8.24/nexusd-cluster-linux-x86_64.tar.gz',
              github: 'nexi-lab/nexus-vfs/releases/download/v0.8.24/nexusd-cluster-linux-x86_64.tar.gz' },
            { file: 'vault.tar.gz', sha: '2f7f32d3b2dde51fa5947cb635d4c0072a98cb0d7256287f8d8c8a42a556de16',
              path: 'nexus-vault/release/v0.5.71/nexus-vault-linux-x86_64.tar.gz',
              github: 'nexi-lab/nexus/releases/download/vault-v0.5.71/nexus-vault-linux-x86_64.tar.gz' },
          ]
          for (const artifact of artifacts) {
            await downloadWithFallback([
              { label: 'COS accelerated', url: `https://sudowork-runtime-1309794936.cos.accelerate.myqcloud.com/${artifact.path}` },
              { label: 'GitHub', url: `https://github.com/${artifact.github}` },
            ], artifact.sha, `${process.env.OLD}/${artifact.file}`)
          }
          NODE
          tar -xzf "$OLD/runtime.tar.gz" -C "$OLD"
          mkdir -p "$OLD/plugins"
          tar -xzf "$OLD/vault.tar.gz" -C "$OLD/plugins"
          bun build --target=node scripts/e2e/broker-upgrade-live.ts --outfile bin/broker-upgrade-live.mjs
          node bin/broker-upgrade-live.mjs \
            "$OLD/nexusd-cluster-linux-x86_64/nexusd-cluster" \
            "$PWD/bin/nexus/nexusd" "$PWD/bin/nexus/plugins" \
            "$RUNNER_TEMP/moss-runtime-evidence" "$OLD/plugins"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexus-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/moss-runtime-evidence/**/acceptance.json

  cohost-live:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: Moss durable session recovery (real daemon)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: bun install --frozen-lockfile
      - name: Verify owner isolation, active daemon crash and exact durable recovery
        run: bash scripts/e2e/run-cohost-recovery.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MOSS_COHOST_ARTIFACTS: ${{ runner.temp }}/moss-cohost-evidence
      - name: Reuse namespace PIDs and preserve replacements across retired callbacks
        run: bash scripts/e2e/run-cohost-recovery.sh
        env:
          NEXUSD_COHOST_BIN: ${{ runner.temp }}/moss-cohost-evidence/release/nexusd-cohost-linux-x64/nexusd-cohost
          MOSS_COHOST_ARTIFACTS: ${{ runner.temp }}/moss-cohost-evidence
          MOSS_COHOST_PID_NAMESPACE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-cohost-recovery
          path: |
            ${{ runner.temp }}/moss-cohost-evidence/**/acceptance.json
            ${{ runner.temp }}/moss-cohost-evidence/**/daemon.log
            ${{ runner.temp }}/moss-cohost-evidence/binary-version.txt

  user-pod-live:
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: User Pod ownership and durable recovery (real K3s)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/shared-images
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/moss-user-pod/cache
          key: owner-pod-releases-v1-${{ hashFiles('scripts/e2e/user-pod/acceptance.lock.json', 'deploy/runtime/gvisor/distribution.lock.json') }}
      - name: Prepare the installed consumer and isolated Node helper
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/moss-user-pod"
          mkdir -p "$work/bin"
          for entry in run-user-pod-live user-pod-runtime user-pod-recovery user-pod-release-upgrade; do
            bun build --target=node "scripts/e2e/$entry.ts" --outfile "$work/bin/$entry.mjs"
          done
          cp scripts/e2e/mock-openai-server.mjs "$work/bin/"
          bun scripts/fetch-nexus-runtime.js
          cp bin/nexus/nexusd "$work/bin/nexusd-linux"
          docker build -t moss-owner-e2e:ci -f scripts/e2e/user-pod/Dockerfile scripts/e2e/user-pod
      - name: Verify mTLS, two cohosts, exact PVC recovery and release rollback
        shell: bash
        run: |
          python3 scripts/e2e/user-pod/run.py --work-dir "$RUNNER_TEMP/moss-user-pod/cluster" \
            --bin-dir "$RUNNER_TEMP/moss-user-pod/bin" --shared-source "$PWD/.moss-image-tools" \
            --helper-image moss-owner-e2e:ci --cache "$RUNNER_TEMP/moss-user-pod/cache"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moss-user-pod-ownership-and-recovery
          path: |
            ${{ runner.temp }}/moss-user-pod/cluster/receipt.json
            ${{ runner.temp }}/moss-user-pod/cluster/evidence/**/acceptance.json
            ${{ runner.temp }}/moss-user-pod/cluster/evidence/**/user-pod-result.json
            ${{ runner.temp }}/moss-user-pod/cluster/evidence/**/user-pod-recovery.json
            ${{ runner.temp }}/moss-user-pod/cluster/evidence/**/release-upgrade.json
            ${{ runner.temp }}/moss-user-pod/cluster/live-runtime-processes.json
            ${{ runner.temp }}/moss-user-pod/cluster/installed.json
            ${{ runner.temp }}/moss-user-pod/cluster/node-service-*.json
            ${{ runner.temp }}/moss-user-pod/cluster/preceding-workload.stdout.log
            ${{ runner.temp }}/moss-user-pod/cluster/retained-workload.stdout.log
            ${{ runner.temp }}/moss-user-pod/cluster/preceding-qualified-workload.stdout.log
            ${{ runner.temp }}/moss-user-pod/cluster/retained-qualified-workload.stdout.log
            ${{ runner.temp }}/moss-user-pod/cluster/repaired-installation.json
            ${{ runner.temp }}/moss-user-pod/cluster/repair-runtime.stderr.log
            ${{ runner.temp }}/moss-user-pod/cluster/prepare-runtime.stderr.log
            ${{ runner.temp }}/moss-user-pod/cluster/retain-worker.stderr.log
            ${{ runner.temp }}/moss-user-pod/cluster/unpack-worker.stderr.log

  build:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    name: build-${{ matrix.arch }}
    needs: [test, runtime-live, cohost-live, user-pod-live]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      MOSS_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Checkout moss
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Start PostgreSQL for acceptance
        uses: ./.github/actions/start-postgres

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#server-v}"
          else
            VERSION="dev-${GITHUB_SHA::8}"
            RELEASE_TAG="server-v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          SCODE_VERSION="$(node -p "require('./src/server/nexus/runtime-versions.json').scode")"
          case '${{ matrix.arch }}' in
            amd64) SCODE_CHECKSUM_KEY=scode-linux-x64-bundle-sha256 ;;
            arm64) SCODE_CHECKSUM_KEY=scode-linux-arm64-sha256 ;;
          esac
          SCODE_BUNDLE_SHA256="$(node -p "require('./src/server/nexus/runtime-versions.json')['$SCODE_CHECKSUM_KEY']")"
          [[ "$SCODE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SCODE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$VERSION-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "scode_version=$SCODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Bun for release manifest generation
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install release manifest dependencies
        run: bun install --frozen-lockfile

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/package-server.sh
          bash -n deploy/package-control-images.sh
          bash -n deploy/fetch-scode.sh
          bash -n deploy/k3s/install-control.sh
          python3 -m unittest discover -s deploy/k3s -p 'test_*.py'
          python3 -m unittest discover -s deploy -p 'test_fetch_scode.py'
          bash -n scripts/publish-server-to-cos.sh
          bash -n scripts/e2e/run-server-release-smoke.sh
          node --check scripts/e2e/mock-openai-server.mjs
          node --check scripts/e2e/server-release-smoke.mjs
          node --check scripts/e2e/server-admin-browser-smoke.mjs
          node --check scripts/e2e/packaged-pg-ha-smoke.mjs
          chmod +x deploy/install.sh deploy/package-server.sh deploy/package-control-images.sh scripts/publish-server-to-cos.sh \
            scripts/e2e/mock-openai-server.mjs scripts/e2e/server-release-smoke.mjs \
            scripts/e2e/server-admin-browser-smoke.mjs \
            scripts/e2e/run-server-release-smoke.sh
          cos_help_output="$(scripts/publish-server-to-cos.sh --help)"
          grep -Fq 'Usage: publish-server-to-cos.sh' <<< "$cos_help_output"
          grep -Fq -- '--release-only' <<< "$cos_help_output"
          grep -Fq -- '--latest-only' <<< "$cos_help_output"
          help_output="$(MOSS_RELEASE_TAG=server-vtest bash -s -- --help < deploy/install.sh 2>&1)"
          grep -Fq 'Usage: install.sh' <<< "$help_output"
          grep -Fq -- '--download PATH' <<< "$help_output"
          ! grep -Fq 'unbound variable' <<< "$help_output"
          download_dir="$(mktemp -d)"
          download_output="$(MOSS_RELEASE_TAG=server-vtest MOSS_DOWNLOAD_BASE=http://127.0.0.1:9 \
            deploy/install.sh --download "$download_dir" 2>&1 || true)"
          grep -Fq '[moss-install] Downloading install.sh' <<< "$download_output"
          ! grep -Fq 'run as root' <<< "$download_output"
          rm -rf "$download_dir"
          offline_output="$(sudo env SUDO_USER="$USER" MOSS_RELEASE_TAG=server-vtest MOSS_NON_INTERACTIVE=1 \
            bash -s -- --offline < deploy/install.sh 2>&1 || true)"
          grep -Fq -- '--offline must be run from the unpacked install.sh file' <<< "$offline_output"
          ! grep -Fq 'unbound variable' <<< "$offline_output"

      - name: Build host server package
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: deploy/package-server.sh "$VERSION" "$ARCH" dist

      - uses: ./.github/actions/shared-images

      - name: Build separate Server and Nexus images
        run: deploy/package-control-images.sh '${{ steps.release.outputs.version }}' '${{ matrix.arch }}' dist

      - name: Build and smoke-test session runtime image
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          SCODE_VERSION: ${{ steps.release.outputs.scode_version }}
          # Optional. Unauthenticated Hugging Face downloads are rate-limited per
          # IP, and a GitHub runner's IP is shared with every other build, so the
          # model fetch answers 429 at random. The fetch retries either way; a
          # token removes the cause instead of waiting it out.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          secret_args=()
          if [ -n "${HF_TOKEN:-}" ]; then
            secret_args+=(--secret "id=hf_token,env=HF_TOKEN")
          fi
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --load \
            "${secret_args[@]}" \
            -t "my-moss-runtime:$IMAGE_TAG" \
            -f deploy/runtime/Dockerfile .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "my-moss-runtime:$IMAGE_TAG")" = "linux/${{ matrix.arch }}"
          docker run --rm "my-moss-runtime:$IMAGE_TAG" scode version 2>&1 | tee dist/scode-version.txt
          grep -Fq "${SCODE_VERSION#v}" dist/scode-version.txt
          docker run --rm "my-moss-runtime:$IMAGE_TAG" nexusd-cohost --version | tee dist/cohost-version.txt
          COHOST_DIGEST="sha256:$(docker run --rm "my-moss-runtime:$IMAGE_TAG" sha256sum /usr/local/bin/nexusd-cohost | awk '{print $1}')"
          IMAGE_DIGEST="$(docker image inspect "my-moss-runtime:$IMAGE_TAG" --format '{{.Id}}')"
          docker save "my-moss-runtime:$IMAGE_TAG" | gzip -1 > "dist/moss-runtime-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz"
          python3 .moss-image-tools/tools/deploy/images.py --inspect \
            --archive "dist/moss-runtime-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            > "$RUNNER_TEMP/runtime-image-identities-${{ matrix.arch }}.json"
          bun scripts/create-runtime-manifest.ts "${{ steps.release.outputs.release_tag }}" \
            "docker.io/library/my-moss-runtime:$IMAGE_TAG" "$IMAGE_DIGEST" \
            "$RUNNER_TEMP/runtime-image-identities-${{ matrix.arch }}.json" \
            "dist/moss-runtime-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz" \
            dist/scode-version.txt dist/cohost-version.txt "$COHOST_DIGEST" "dist/runtime-release-${{ matrix.arch }}.json"

      - name: Assemble installer and checksums
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sed "s/@@MOSS_RELEASE_TAG@@/$RELEASE_TAG/g" deploy/install.sh > dist/install.sh
          chmod +x dist/install.sh
          # The compute node is provisioned by `install.sh --role compute`; the k3s
          # companions (uninstall + offline fetch) ship verbatim beside it.
          cp deploy/k3s/uninstall-k3s.sh deploy/k3s/fetch-offline-deps.sh dist/
          chmod +x dist/uninstall-k3s.sh dist/fetch-offline-deps.sh
          SERVER_ARCHIVE="moss-server-$VERSION-linux-$ARCH.tar.gz"
          RUNTIME_ARCHIVE="moss-runtime-$VERSION-linux-$ARCH.tar.gz"
          (
            cd dist
            sha256sum "$SERVER_ARCHIVE" "$RUNTIME_ARCHIVE" \
              "moss-server-image-$VERSION-linux-$ARCH.tar.gz" \
              "moss-nexus-image-$VERSION-linux-$ARCH.tar.gz" \
              "moss-deploy-$VERSION-linux-$ARCH.tar.gz" bootstrap-nexus.mjs "runtime-release-$ARCH.json" > "SHA256SUMS-$ARCH"
          )

      - name: Validate release contents
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tar -tzf "dist/moss-server-$VERSION-linux-$ARCH.tar.gz" > dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/moss-server.mjs' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/artifact-mcp.mjs' dist/server-contents.txt
          grep -Fxq 'moss-server/node/bin/node' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/nexus/nexusd' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/nexus/plugins/libnexus_vault.so' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/nexus/plugins/libnexus_vault.so.sig' dist/server-contents.txt
          grep -Fxq 'moss-server/app/bin/scode' dist/server-contents.txt
          package_check_dir="$(mktemp -d)"
          tar -xzf "dist/moss-server-$VERSION-linux-$ARCH.tar.gz" -C "$package_check_dir"
          test -x "$package_check_dir/moss-server/app/bin/scode"
          rm -rf "$package_check_dir"
          ! grep -q '@@MOSS_RELEASE_TAG@@' dist/install.sh
          EXPECTED_RELEASE_LINE="$(printf 'RELEASE_TAG="${MOSS_RELEASE_TAG:-%s}"' "server-v$VERSION")"
          grep -Fq "$EXPECTED_RELEASE_LINE" dist/install.sh
          # One installer entry point: install.sh takes the role (all-in-one /
          # control-plane / compute), including k3s compute nodes and agent joins.
          grep -Fq -- '--role' dist/install.sh
          grep -Fq 'all-in-one' dist/install.sh
          grep -Fq -- '--join' dist/install.sh
          test -x dist/uninstall-k3s.sh
          test -x dist/fetch-offline-deps.sh
          ! grep -Fq 'api.github.com/repos' dist/install.sh
          grep -Fq 'Offline files are ready' dist/install.sh
          grep -Fq 'moss-server-image-' dist/install.sh
          grep -Fq 'moss-nexus-image-' dist/install.sh
          grep -Fq -- '--upgrade' dist/install.sh
          grep -Fq 'already installed; no downloads needed' dist/install.sh
          grep -Fq 'packages/$RELEASE_TAG' dist/install.sh
          grep -Fq -- '--progress-bar' dist/install.sh
          grep -Fq 'sudowork-release-1309794936.cos.accelerate.myqcloud.com/moss/server/releases/$RELEASE_TAG' dist/install.sh

      # The build job never runs `bun install` (it only packages); the PG smoke
      # is its first step needing a Node module. Install just `pg` — the only
      # external import in packaged-pg-ha-smoke.mjs — instead of a full install.
      - name: Install pg driver for the packaged PG smoke
        run: npm install --no-save pg

      - name: Run packaged PostgreSQL dual-instance smoke
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$MOSS_PG_TEST_URL"
          mkdir -p "$RUNNER_TEMP/moss-server-e2e"
          node scripts/e2e/packaged-pg-ha-smoke.mjs \
            --archive "dist/moss-server-$VERSION-linux-$ARCH.tar.gz" \
            --database-url "$MOSS_PG_TEST_URL" \
            --work-dir "$RUNNER_TEMP/moss-server-pg-ha" \
            --report "$RUNNER_TEMP/moss-server-e2e/packaged-pg-ha.json"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.status !== "passed" || report.backend !== "postgres" ||
                report.instanceIds?.length !== 2 || !report.firstStart || !report.restart ||
                report.keyRequests?.length < 5 || !/^[0-9a-f]{64}$/.test(report.bundleSha256 ?? "")) {
              throw new Error("packaged PostgreSQL HA evidence is incomplete");
            }
          ' "$RUNNER_TEMP/moss-server-e2e/packaged-pg-ha.json"

      - name: Install CJK fonts for browser evidence
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk zip
          fc-cache -f

      - name: Install native Chromium for browser acceptance
        run: |
          set -euo pipefail
          BROWSER_TOOLS="$RUNNER_TEMP/moss-browser"
          npm install --prefix "$BROWSER_TOOLS" --no-save --package-lock=false playwright@1.56.1
          "$BROWSER_TOOLS/node_modules/.bin/playwright" install --with-deps chromium
          BROWSER="$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$BROWSER_TOOLS/node_modules/playwright")"
          "$BROWSER" --version
          echo "MOSS_E2E_BROWSER=$BROWSER" >> "$GITHUB_ENV"

      - name: Run packaged Server E2E smoke
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
          SCODE_VERSION: ${{ steps.release.outputs.scode_version }}
        run: |
          scripts/e2e/run-server-release-smoke.sh \
            "$VERSION" "$ARCH" dist "$RUNNER_TEMP/moss-server-e2e" "$SCODE_VERSION"

      - name: Upload Server E2E diagnostics
        id: server_e2e_diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moss-server-e2e-${{ steps.release.outputs.version }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/moss-server-e2e/
            ${{ runner.temp }}/moss-server-pg-ha/instance-*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Run Kubernetes image installation E2E
        run: bash scripts/e2e/run-k3s-release-smoke.sh '${{ steps.release.outputs.version }}' dist

      - name: Upload Kubernetes installation diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: moss-k3s-installation-evidence-${{ matrix.arch }}
          path: dist/k3s-evidence/
          if-no-files-found: warn

      - name: Publish Server E2E evidence summary
        if: always()
        shell: bash
        env:
          E2E_ARTIFACT_URL: ${{ steps.server_e2e_diagnostics.outputs.artifact-url }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/moss-server-e2e/ci-summary.md"
          {
            echo '## Moss Server packaged E2E'
            echo
            if [[ -f "$REPORT" ]]; then
              cat "$REPORT"
            else
              echo '❌ E2E 未完整通过；请查看诊断 artifact 中的日志与失败页面截图。'
            fi
            echo
            if [[ -n "$E2E_ARTIFACT_URL" ]]; then
              echo "[下载浏览器截图与完整诊断]($E2E_ARTIFACT_URL)"
            else
              echo '诊断 artifact 未成功上传。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload architecture assets
        uses: actions/upload-artifact@v5
        with:
          name: moss-server-release-${{ matrix.arch }}
          path: |
            dist/moss-server-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/moss-runtime-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/moss-server-image-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/moss-nexus-image-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/moss-deploy-${{ steps.release.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/bootstrap-nexus.mjs
            dist/runtime-release-${{ matrix.arch }}.json
            dist/SHA256SUMS-${{ matrix.arch }}
            dist/install.sh
            dist/uninstall-k3s.sh
            dist/fetch-offline-deps.sh
            dist/moss-server-e2e-report-${{ steps.release.outputs.version }}-${{ matrix.arch }}.zip
          retention-days: 30

  release:
    name: publish-server-release
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout moss
        uses: actions/checkout@v5

      - name: Select release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME#server-v}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download build assets
        uses: actions/download-artifact@v5
        with:
          pattern: moss-server-release-*
          path: artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          for shared in install.sh bootstrap-nexus.mjs uninstall-k3s.sh fetch-offline-deps.sh; do
            cmp "artifacts/moss-server-release-amd64/$shared" "artifacts/moss-server-release-arm64/$shared"
          done
          find artifacts -type f \( -name '*.tar.gz' -o -name 'runtime-release-*.json' \) -exec cp {} release-assets/ \;
          cp release-assets/runtime-release-amd64.json release-assets/runtime-release.json
          (cd release-assets && sha256sum runtime-release.json) > release-assets/SHA256SUMS-alias
          find artifacts -type f -name 'moss-server-e2e-report-*.zip' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'SHA256SUMS-*' -exec cat {} \; | sort -k2 | uniq > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS-alias >> release-assets/SHA256SUMS
          rm release-assets/SHA256SUMS-alias
          cp "$(find artifacts -type f -name install.sh -print -quit)" release-assets/install.sh
          cp "$(find artifacts -type f -name bootstrap-nexus.mjs -print -quit)" release-assets/bootstrap-nexus.mjs
          cp "$(find artifacts -type f -name uninstall-k3s.sh -print -quit)" release-assets/uninstall-k3s.sh
          cp "$(find artifacts -type f -name fetch-offline-deps.sh -print -quit)" release-assets/fetch-offline-deps.sh
          chmod +x release-assets/install.sh \
            release-assets/uninstall-k3s.sh release-assets/fetch-offline-deps.sh
          # SHA256SUMS covers only the tarballs (scripts stay out, like install.sh).
          (cd release-assets && sha256sum -c SHA256SUMS)
          ls -lh release-assets

      - name: Upload immutable release to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: sudowork-release-1309794936
          COS_ROOT_PATH: moss/server
          COS_PUBLIC_BASE_URL: https://sudowork-release-1309794936.cos.accelerate.myqcloud.com
        run: |
          set -euo pipefail
          [ -n "$TENCENT_SECRET_ID" ] || { echo 'TENCENT_SECRET_ID is not configured'; exit 1; }
          [ -n "$TENCENT_SECRET_KEY" ] || { echo 'TENCENT_SECRET_KEY is not configured'; exit 1; }
          pip install coscmd==1.9.0.6
          coscmd config -a "$TENCENT_SECRET_ID" -s "$TENCENT_SECRET_KEY" \
            -b "$COS_BUCKET" -e cos.accelerate.myqcloud.com
          bash scripts/publish-server-to-cos.sh release-assets "$GITHUB_REF_NAME" --release-only

      - name: Publish server release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Native Linux amd64 and arm64 host packages, Kubernetes Server/Nexus images, session Runtime images, deployment tools, and per-architecture runtime manifests are verified by the release CI.

            The one-click installer deploys Server and Nexus on Kubernetes. Existing external Nexus and ZoneId-bound installations require a separate migration and are refused before services are stopped.

            Prereleases publish complete packages to the fixed COS release directory and keep the current stable `latest` entrypoints unchanged.
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.channel.outputs.prerelease != 'true' }}
          files: |
            release-assets/*.tar.gz
            release-assets/install.sh
            release-assets/bootstrap-nexus.mjs
            release-assets/uninstall-k3s.sh
            release-assets/fetch-offline-deps.sh
            release-assets/SHA256SUMS
            release-assets/runtime-release*.json
            release-assets/moss-server-e2e-report-*.zip

      - name: Publish Tencent COS Latest entrypoint
        if: steps.channel.outputs.prerelease != 'true'
        env:
          COS_BUCKET: sudowork-release-1309794936
          COS_ROOT_PATH: moss/server
          COS_PUBLIC_BASE_URL: https://sudowork-release-1309794936.cos.accelerate.myqcloud.com
        run: bash scripts/publish-server-to-cos.sh release-assets "$GITHUB_REF_NAME" --latest-only
