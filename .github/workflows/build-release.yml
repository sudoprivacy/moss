# ---------------------------------------------------------
# Moss Release Package Builder
# 触发条件:
#   - dev 分支推送
#   - 手动触发 (可指定 scode 版本)
#   - tag 推送 (创建 GitHub Release)
#
# 产出物:
#   - moss-deploy-{commit8}-amd64.tar.gz
#   - moss-deploy-{commit8}-arm64.tar.gz
#   包含:
#     - my-moss-runtime-{tag}.tar.gz (会话容器镜像)
#     - my-moss-server-{tag}.tar.gz (主服务镜像)
#     - server.json
#     - docker-compose.yml
#     - start.sh
#     - shutdown.sh
# ---------------------------------------------------------

name: Build Moss Release Package

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      scode_version:
        description: 'scode release version (e.g., v0.1.0)'
        required: false
        default: 'latest'

env:
  BUN_VERSION: '1.3'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: linux/amd64
            target_arch: amd64
            scode_arch: x64
          - target_platform: linux/arm64
            target_arch: arm64
            scode_arch: arm64
    name: build-${{ matrix.target_arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 拉取 git-lfs 对象（deploy/models/Xenova.zip 嵌入模型）。否则 checkout
          # 只得到 LFS 指针文件，server.Dockerfile.local 会把指针而非真模型打进镜像。
          lfs: true

      # 1. 设置镜像 tag (git commit 前 8 位)
      - name: Set image tag
        id: tag
        run: |
          COMMIT_TAG=$(echo $GITHUB_SHA | cut -c1-8)
          TARGET_ARCH="${{ matrix.target_arch }}"
          IMAGE_TAG="$COMMIT_TAG-$TARGET_ARCH"
          echo "COMMIT_TAG=$COMMIT_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "TARGET_PLATFORM=${{ matrix.target_platform }}" >> $GITHUB_OUTPUT
          echo "TARGET_ARCH=$TARGET_ARCH" >> $GITHUB_OUTPUT
          echo "Commit tag: $COMMIT_TAG"
          echo "Image tag: $IMAGE_TAG"
          echo "Target platform: ${{ matrix.target_platform }}"

      # 2. 安装 Bun 并构建 (build:node 已包含前端构建)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Dependencies
        run: |
          bun install
          cd admin && bun install && cd ..

      - name: Build All (Backend + Frontend)
        run: bun run build:node

      # 3. 下载 scode
      - name: Get scode version
        id: scode-version
        run: |
          # 优先级: 手动输入 > 配置文件(server.json) > latest
          INPUT_VERSION="${{ github.event.inputs.scode_version }}"
          CONFIG_VERSION=$(grep -o '"scodeVersion"[[:space:]]*:[[:space:]]*"[^"]*"' deploy/server.json | sed 's/.*"scodeVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/')

          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "latest" ]; then
            VERSION="$INPUT_VERSION"
            echo "Using version from workflow input: $VERSION"
          elif [ -n "$CONFIG_VERSION" ] && [ "$CONFIG_VERSION" != "latest" ]; then
            VERSION="$CONFIG_VERSION"
            echo "Using version from server.json config: $VERSION"
          else
            VERSION=$(curl -sI "https://github.com/sudoprivacy/sudocode/releases/latest" | grep -i "location:" | sed 's/.*tag\///' | tr -d '\r\n')
            if [ -z "$VERSION" ]; then
              VERSION=$(curl -s https://api.github.com/repos/sudoprivacy/sudocode/releases/latest | grep '"tag_name"' | sed 's/.*"tag_name": *"\([^"]*\)".*/\1/')
            fi
            echo "Using latest version: $VERSION"
          fi

          echo "Detected scode version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download scode
        env:
          SCODE_VERSION: ${{ steps.scode-version.outputs.version }}
        run: |
          SCODE_ARCH="${{ matrix.scode_arch }}"

          echo "Downloading scode $SCODE_VERSION for linux-$SCODE_ARCH"

          DOWNLOAD_URL="https://github.com/sudoprivacy/sudocode/releases/download/$SCODE_VERSION/scode-linux-$SCODE_ARCH.tar.gz"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -o scode.tar.gz "$DOWNLOAD_URL"

          tar -xzf scode.tar.gz
          mv "scode-linux-$SCODE_ARCH/scode" bin/scode
          chmod +x bin/scode
          rm -rf "scode-linux-$SCODE_ARCH" scode.tar.gz

          echo "scode ready: $(ls -la bin/scode)"

      # 4. 设置 Docker Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stage sudocode for server image
        uses: actions/checkout@v4
        with:
          repository: sudoprivacy/sudocode
          path: .sudocode-build-context
          token: ${{ secrets.SUDOCODE_REPO_TOKEN || github.token }}

      # 5. 构建 Runtime 镜像 (会话容器)
      - name: Build Runtime Docker Image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          TARGET_PLATFORM: ${{ steps.tag.outputs.TARGET_PLATFORM }}
        run: |
          echo "Building runtime image with tag: $IMAGE_TAG platform: $TARGET_PLATFORM"
          docker buildx build --platform "$TARGET_PLATFORM" --load -t my-moss-runtime:$IMAGE_TAG -f deploy/runtime/Dockerfile .
          docker save --platform "$TARGET_PLATFORM" my-moss-runtime:$IMAGE_TAG | gzip > my-moss-runtime-$IMAGE_TAG.tar.gz
          echo "Runtime image size: $(ls -lh my-moss-runtime-$IMAGE_TAG.tar.gz)"

      # 6. 构建 Server 镜像 (主服务)
      - name: Build Server Docker Image
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          SCODE_VERSION: ${{ steps.scode-version.outputs.version }}
          TARGET_PLATFORM: ${{ steps.tag.outputs.TARGET_PLATFORM }}
        run: |
          echo "Building server image with tag: $IMAGE_TAG platform: $TARGET_PLATFORM"
          docker buildx build \
            --platform "$TARGET_PLATFORM" \
            --load \
            --build-arg SCODE_VERSION="$SCODE_VERSION" \
            -t my-moss-server:$IMAGE_TAG \
            -f deploy/server.Dockerfile.local .
          docker save --platform "$TARGET_PLATFORM" my-moss-server:$IMAGE_TAG | gzip > my-moss-server-$IMAGE_TAG.tar.gz
          echo "Server image size: $(ls -lh my-moss-server-$IMAGE_TAG.tar.gz)"

      # 7. 组装部署包
      - name: Assemble Release Package
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          TARGET_ARCH: ${{ steps.tag.outputs.TARGET_ARCH }}
        run: |
          mkdir -p release/moss

          # 复制镜像文件
          cp my-moss-runtime-$IMAGE_TAG.tar.gz release/moss/
          cp my-moss-server-$IMAGE_TAG.tar.gz release/moss/

          # 复制配置文件，并更新镜像 tag
          cp deploy/server.json release/moss/
          sed -i "s/my-moss-runtime:v1/my-moss-runtime:$IMAGE_TAG/g" release/moss/server.json
          cp deploy/docker-compose.yml release/moss/

          # 复制启动脚本
          cp deploy/start.sh release/moss/
          cp deploy/shutdown.sh release/moss/
          chmod +x release/moss/start.sh
          chmod +x release/moss/shutdown.sh

          # 复制说明文档
          cp deploy/README.md release/moss/
          cp deploy/cabin-mock-server.js release/moss/

          # 打包
          cd release
          tar -czvf ../moss-deploy-$IMAGE_TAG.tar.gz moss
          cd ..

          echo "Package ready: $(ls -lh moss-deploy-$IMAGE_TAG.tar.gz)"
          echo "Package contents:"
          tar -tzvf moss-deploy-$IMAGE_TAG.tar.gz
          echo ""
          echo "server.json dockerImage config:"
          grep "dockerImage" release/moss/server.json

      # 8. 上传构建产物
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moss-deploy-${{ steps.tag.outputs.IMAGE_TAG }}
          path: moss-deploy-${{ steps.tag.outputs.IMAGE_TAG }}.tar.gz
          retention-days: 30

  # 创建 GitHub Release（当打 tag 时）
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -name "*.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/moss-*.tar.gz
          generate_release_notes: true
