name: Managed browser acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'deploy/browser/**'
      - 'src/server/browser/**'
      - 'src/server/runtime/dockerCommand.ts'
      - 'src/server/runtimeService.ts'
      - 'src/server/server.ts'
      - '.github/workflows/managed-browser.yml'
  push:
    branches: [dev]
    paths:
      - 'deploy/browser/**'
      - 'src/server/browser/**'
      - '.github/workflows/managed-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-managed-profiles:
    # Skipped on draft PRs: heavy CI starts once the PR is marked ready.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_VERSION: '156.0.8078.47-1'
      CHROME_SHA256: '6c92cd22e90c6e3e255d782991543fa2091db8614e8536a971a7433a5c4d7ac8'
      LEGACY_CHROME_VERSION: '155.0.8059.84-1'
      LEGACY_CHROME_SHA256: '8fbd2ae69cdf7ee98b7513c3396a7b5e06f974f8625fdd590df3091dd0c3e9de'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/ai-dev-browser
          ref: d461f887985ed03373dd33799469338a00a2ed25 # ai-dev-browser v0.58.6.
          path: adb-core
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/ai-dev-browser
          ref: v0.54.0
          path: adb-previous-extension
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build branded Chrome and private worker
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/browser-extension-signing.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_file" 2>/dev/null
          chmod 600 "$key_file"
          docker build -f adb-core/deploy/managed-chrome/Dockerfile \
            --secret "id=extension_key,src=$key_file" \
            --build-arg SOURCE_REVISION="$(git -C adb-core rev-parse HEAD)" \
            -t managed-browser-base:ci adb-core
          docker build -f deploy/browser/chrome-version.Dockerfile \
            --build-arg BROWSER_BASE_IMAGE=managed-browser-base:ci \
            --build-arg CHROME_VERSION="$CHROME_VERSION" \
            --build-arg CHROME_SHA256="$CHROME_SHA256" \
            -t managed-browser-chrome:ci deploy/browser
          docker build --build-arg ADB_BROWSER_IMAGE=managed-browser-chrome:ci \
            -t managed-browser-worker:ci deploy/browser
      - name: Verify isolated persistent profiles with actual Chrome
        shell: bash
        run: |
          set -euo pipefail
          export MOSS_BROWSER_IMAGE="$(docker image inspect managed-browser-worker:ci --format '{{.Id}}')"
          export MOSS_BROWSER_SECRET="$(openssl rand -hex 32)"
          export MOSS_BROWSER_LIVE_HOST="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          node --import tsx src/server/browser/browserWorkerRegistry.live.ts 2>&1 | tee "$RUNNER_TEMP/browser-profile-acceptance.log"
      - name: Verify explicit browser lifecycle with actual Chrome
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/browser/fixtures/lifecycle-test.Dockerfile \
            --build-arg BROWSER_WORKER_IMAGE=managed-browser-worker:ci \
            -t managed-browser-lifecycle:ci deploy/browser
          docker run --rm --init --pids-limit 256 --memory 1536m --cpus 1.5 \
            --cap-drop ALL --security-opt no-new-privileges --shm-size 256m \
            managed-browser-lifecycle:ci 2>&1 | tee "$RUNNER_TEMP/browser-lifecycle.log"
      - name: Verify selection and native launches with the installed public SDK
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init --network none --pids-limit 384 --memory 1536m --cpus 1 \
            --cap-drop ALL --security-opt no-new-privileges --shm-size 256m \
            --mount "type=bind,source=$PWD/adb-core/tests,target=/opt/sdk-acceptance/tests,readonly" \
            --mount "type=bind,source=$PWD/adb-core/pyproject.toml,target=/opt/sdk-acceptance/pyproject.toml,readonly" \
            --workdir /opt/sdk-acceptance --env PYTHONPATH=/opt/sdk-acceptance \
            managed-browser-lifecycle:ci /opt/browser/venv/bin/python /opt/browser/run_sdk_acceptance.py \
            tests/integration/test_remote_selection_live.py \
            tests/integration/test_browser_worker_live.py \
            tests/integration/test_remote_vnc.py \
            tests/integration/test_worker_window_stream_live.py -v --tb=short -p no:cacheprovider \
            2>&1 | tee "$RUNNER_TEMP/browser-selection-native.log"
      - name: Verify signed extension upgrade and profile crash recovery
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/browser/chrome-version.Dockerfile \
            --build-arg BROWSER_BASE_IMAGE=managed-browser-worker:ci \
            --build-arg CHROME_VERSION="$LEGACY_CHROME_VERSION" \
            --build-arg CHROME_SHA256="$LEGACY_CHROME_SHA256" \
            -t managed-browser-chrome:legacy-ci deploy/browser
          docker build -f deploy/browser/fixtures/legacy-extension.Dockerfile \
            --secret "id=extension_key,src=$RUNNER_TEMP/browser-extension-signing.pem" \
            --build-arg BROWSER_WORKER_IMAGE=managed-browser-chrome:legacy-ci \
            -t managed-browser-worker:legacy-extension-ci adb-previous-extension
          python3 deploy/browser/live_docker.py \
            --image managed-browser-worker:ci \
            --prior-image managed-browser-worker:legacy-extension-ci \
            --output "$RUNNER_TEMP/browser-profile-upgrade.json" \
            2>&1 | tee "$RUNNER_TEMP/browser-profile-upgrade.log"
      - name: Verify staged per-owner upgrade with human control
        shell: bash
        run: |
          set -euo pipefail
          export MOSS_BROWSER_IMAGE="$(docker image inspect managed-browser-worker:ci --format '{{.Id}}')"
          export MOSS_BROWSER_PRIOR_IMAGE="$(docker image inspect managed-browser-worker:legacy-extension-ci --format '{{.Id}}')"
          export MOSS_BROWSER_SECRET="$(openssl rand -hex 32)"
          export MOSS_BROWSER_LIVE_HOST="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          node --import tsx src/server/browser/browserOwnerImages.live.ts \
            2>&1 | tee "$RUNNER_TEMP/browser-owner-images.log"
      - name: Preserve acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-profile-acceptance
          path: |
            ${{ runner.temp }}/browser-profile-acceptance.log
            ${{ runner.temp }}/browser-lifecycle.log
            ${{ runner.temp }}/browser-selection-native.log
            ${{ runner.temp }}/browser-profile-upgrade.log
            ${{ runner.temp }}/browser-profile-upgrade.json
            ${{ runner.temp }}/browser-owner-images.log
          if-no-files-found: ignore
