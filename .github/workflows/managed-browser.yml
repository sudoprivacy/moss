name: Managed browser acceptance

on:
  pull_request:
    paths:
      - 'deploy/browser/**'
      - 'src/server/browser/**'
      - 'src/server/runtime/dockerCommand.ts'
      - 'src/server/runtimeService.ts'
      - 'src/server/server.ts'
      - '.github/workflows/managed-browser.yml'
  push:
    branches: [dev]
    paths:
      - 'deploy/browser/**'
      - 'src/server/browser/**'
      - '.github/workflows/managed-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-managed-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/ai-dev-browser
          ref: a2610df3132c33c7bd0cb4927550ca4ef98cf4b6 # v0.55.0
          path: adb-core
      - uses: actions/checkout@v4
        with:
          repository: sudoprivacy/ai-dev-browser
          ref: v0.54.0
          path: adb-previous-extension
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Build branded Chrome and private worker
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/browser-extension-signing.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_file" 2>/dev/null
          chmod 600 "$key_file"
          docker build -f adb-core/deploy/managed-chrome/Dockerfile \
            --secret "id=extension_key,src=$key_file" \
            --build-arg SOURCE_REVISION=a2610df3132c33c7bd0cb4927550ca4ef98cf4b6 \
            -t managed-browser-base:ci adb-core
          docker build --build-arg ADB_BROWSER_IMAGE=managed-browser-base:ci \
            -t managed-browser-worker:ci deploy/browser
      - name: Verify isolated persistent profiles with actual Chrome
        shell: bash
        run: |
          set -euo pipefail
          export MOSS_BROWSER_IMAGE="$(docker image inspect managed-browser-worker:ci --format '{{.Id}}')"
          export MOSS_BROWSER_SECRET="$(openssl rand -hex 32)"
          export MOSS_BROWSER_LIVE_HOST="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          node --import tsx src/server/browser/browserWorkerRegistry.live.ts 2>&1 | tee "$RUNNER_TEMP/browser-profile-acceptance.log"
      - name: Verify signed extension upgrade and profile crash recovery
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/browser/fixtures/legacy-extension.Dockerfile \
            --secret "id=extension_key,src=$RUNNER_TEMP/browser-extension-signing.pem" \
            --build-arg BROWSER_WORKER_IMAGE=managed-browser-worker:ci \
            -t managed-browser-worker:legacy-extension-ci adb-previous-extension
          python3 deploy/browser/live_docker.py \
            --image managed-browser-worker:ci \
            --prior-image managed-browser-worker:legacy-extension-ci \
            --output "$RUNNER_TEMP/browser-profile-upgrade.json" \
            2>&1 | tee "$RUNNER_TEMP/browser-profile-upgrade.log"
      - name: Preserve acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-profile-acceptance
          path: |
            ${{ runner.temp }}/browser-profile-acceptance.log
            ${{ runner.temp }}/browser-profile-upgrade.log
            ${{ runner.temp }}/browser-profile-upgrade.json
          if-no-files-found: ignore
