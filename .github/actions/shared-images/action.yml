name: Verified shared image tools
description: Check out and verify the deployment tools from the production source lock
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        lock = json.loads(Path('deploy/k3s/sudostack-images.lock.json').read_text())
        assert lock['repository'] == 'sudoprivacy/sudostack'
        assert re.fullmatch(r'[a-f0-9]{40}', lock['revision'])
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('revision=' + lock['revision'] + '\n')
        PY
    - uses: actions/checkout@v4
      with:
        repository: sudoprivacy/sudostack
        ref: ${{ steps.pin.outputs.revision }}
        path: .moss-image-tools
        sparse-checkout: |
          tools/deploy/images.py
          tools/deploy/artifacts.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Verify the same bytes used by the production deployment bundle
      shell: bash
      run: |
        python3 deploy/k3s/package_deployment.py --shared-source .moss-image-tools \
          --output "$RUNNER_TEMP/moss-verified-image-tools.tar.gz"
