<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .title {
      font-weight: 600;
      font-size: 14px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 16px;
      line-height: 1;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #e2e8f0;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }
    .btn.primary {
      background: #3b82f6;
      border-color: #3b82f6;
    }
    .btn.primary:hover {
      background: #2563eb;
    }
    .prompt-section {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 16px;
      background: rgba(15, 23, 42, 0.95);
    }
    .prompt-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .prompt-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3);
      color: #e2e8f0;
      font-size: 13px;
      resize: none;
      min-height: 60px;
    }
    .prompt-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .prompt-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .status {
      font-size: 11px;
      color: #64748b;
    }
    .output {
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 12px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
      color: #93c5fd;
    }
    .info-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      font-size: 12px;
    }
    .info-label {
      color: #64748b;
    }
    .info-value {
      color: #e2e8f0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="title" id="title">Moss Debug</span>
      <button class="close-btn" id="closeBtn">×</button>
    </div>
    <div class="content">
      <div class="section">
        <div class="section-title">Actions</div>
        <div class="actions">
          <button class="btn" data-action="info">App Info</button>
          <button class="btn" data-action="meta">Meta</button>
          <button class="btn" data-action="storage">Storage</button>
          <button class="btn" data-action="files">Files</button>
          <button class="btn" data-action="tools">Tools</button>
          <button class="btn" data-action="resources">Resources</button>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Output</div>
        <pre class="output" id="output">Debug panel ready.</pre>
      </div>
      <div class="section">
        <div class="section-title">Environment</div>
        <div class="info-grid">
          <span class="info-label">Host API:</span>
          <span class="info-value">window.mossApp</span>
          <span class="info-label">App:</span>
          <span class="info-value" id="appName">-</span>
        </div>
      </div>
    </div>
    <div class="prompt-section">
      <div class="prompt-label">Agent Prompt</div>
      <textarea class="prompt-input" id="promptInput" placeholder="让内置 agent 帮 app 做一件事"></textarea>
      <div class="prompt-actions">
        <span class="status" id="status">Ready</span>
        <button class="btn primary" id="sendBtn">发送给 Agent</button>
      </div>
    </div>
  </div>
  <script>
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const promptInput = document.getElementById('promptInput');
    const closeBtn = document.getElementById('closeBtn');
    const sendBtn = document.getElementById('sendBtn');
    const titleEl = document.getElementById('title');
    const appNameEl = document.getElementById('appName');

    let appName = '';

    closeBtn.addEventListener('click', () => {
      window.debugAPI.close();
    });

    window.debugAPI.init(({ name }) => {
      appName = name;
      titleEl.textContent = 'Moss Debug - ' + name;
      appNameEl.textContent = name;
      output.textContent = 'Debug panel ready for: ' + name;
    });

    window.debugAPI.onAgentEvent((event) => {
      console.log('Agent event:', event);
      if (event.type === 'agent:delta') {
        status.textContent = 'Agent typing...';
      } else if (event.type === 'agent:complete') {
        status.textContent = 'Agent completed';
      } else if (event.type === 'agent:error') {
        status.textContent = 'Agent error';
        output.textContent = 'Error: ' + (event.error?.message || 'Unknown error');
      }
    });

    window.debugAPI.onResponse((data) => {
      console.log('Response:', data);
      if (data.error) {
        output.textContent = 'Error: ' + data.error;
        status.textContent = 'Error';
      } else if (data.result) {
        output.textContent = JSON.stringify(data.result, null, 2);
        status.textContent = 'Ready';
      }
    });

    sendBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      status.textContent = 'Sending...';
      try {
        window.debugAPI.sendToAgent({ prompt, appName });
        promptInput.value = '';
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
      }
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
