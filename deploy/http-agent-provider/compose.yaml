services:
  provider:
    image: ${PROVIDER_IMAGE:?Set an artifact-specific image tag}
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    ports: ["8093:8093"]
    volumes:
      - ./provider.json:/run/provider/provider.json:ro
      - ./secrets:/run/secrets:ro
      - ./data:/data
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8093/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "3" }
