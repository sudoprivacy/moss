# ============================================================================
# moss LB — 跨主机多实例（P3-1）：与 docker-compose.ha-crosshost.yml 配套
# ============================================================================
# 从 moss-sticky-active-active.conf 派生，差异：
#   1. upstream 成员是【主机地址】而非容器名（跨主机无 compose 网络）。两台主机的
#      nginx 挂载【同一份本文件】——每个 nginx 都必须能把 owner 路由到任意主机，
#      否则 VIP 漂移到 B 后 B 无法转发属于 A 上 session 的 WS。
#   2. 两级 map 的键值 = 各主机 MOSS_INSTANCE_ID（示例 host-a/host-b）。三者必须
#      一致：map 键 == MOSS_INSTANCE_ID == 服务端 ws_url/cookie 下发的 route 值；
#      任一不一致 → 该实例的粘滞路由静默退化为 pool（表现为 WS 409 重连风暴）。
#   3. nginx 以 network_mode: host 运行（compose 侧），本机实例可用 127.0.0.1。
#
# 部署步骤：把 <HOST_A>/<HOST_B> 替换为两台主机的 IP 或 DNS 名（保留 127.0.0.1 的
# 本机条目可留可去——多一条解析开销而已），host-a/host-b 替换为实际 MOSS_INSTANCE_ID。
# 实例数变化时同步本文件并滚动 reload 两台 nginx（README-ha SOP）。
# ----------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 粘滞目标（单 server 组：max_fails/fail_timeout 被 nginx 忽略，实例死亡时该组 502
# 无 fallback——由客户端 owner-aware 自愈兜底，同 sticky conf 的已知限制）。
upstream moss_host_a {
    server <HOST_A>:43127;
    keepalive 32;
}

upstream moss_host_b {
    server <HOST_B>:43127;
    keepalive 32;
}

# 无 route 流量池（503 摘流仅经此组生效；drain SOP 依赖）。
upstream moss_pool {
    least_conn;
    server <HOST_A>:43127 max_fails=3 fail_timeout=10s;
    server <HOST_B>:43127 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 企微回调专用 upstream（43128 独立端口；主端口无回调路由不得复用，见 sticky conf
# 同款说明）。企微服务器无 cookie，走 pool 轮询。
upstream moss_callback {
    least_conn;
    server <HOST_A>:43128 max_fails=3 fail_timeout=10s;
    server <HOST_B>:43128 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 43128;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://moss_callback;
    }
}

# 两级 map：query(?moss_route=) 优先、cookie 兜底、default pool。
# 键（host-a/host-b）== 各主机 MOSS_INSTANCE_ID == MOSS_ROUTE_COOKIE_NAME 对应值。
map $cookie_moss_route $moss_cookie_upstream {
    default moss_pool;
    host-a  moss_host_a;
    host-b  moss_host_b;
}

map $arg_moss_route $moss_upstream {
    default $moss_cookie_upstream;
    host-a  moss_host_a;
    host-b  moss_host_b;
}

server {
    listen 80;
    server_name moss.example.com;

    client_max_body_size 1024m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_next_upstream error timeout http_503;

    location = /healthz {
        proxy_pass http://$moss_upstream;
    }

    # 摘流探测显式走 pool；轮询方不得携带 moss_route cookie（同 sticky conf）。
    location = /readyz {
        proxy_pass http://moss_pool;
    }

    # WS（含 P2-5 内部端点 /ws/internal/sessions/:id——与外部端点同规则）。
    location /ws/ {
        proxy_pass http://$moss_upstream;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SSE：wiki build events
    location ~ ^/api/v1/.*/build-events$ {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：MCP events
    location /api/v1/mcp/events {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：cabin AI chat 流式
    location = /v1/ai-chat/send {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：cabin voice chat 流式
    location = /v1/voice-chat/send {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://$moss_upstream;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ----------------------------------------------------------------------------
# TLS：在 server 块加 443 ssl 与证书（同其他 conf 文末说明）；HTTPS 下各实例设
# MOSS_ROUTE_COOKIE_SECURE=true。
#
# keepalived VIP：见同目录 keepalived.conf.sample（两台主机分别 MASTER/BACKUP，
# VIP 抢主 = LB 层计划内单点，切换秒级）；云 SLB 替代方案见 README-ha 跨主机节
#（后端池填两台主机 80/43128，健康检查 /healthz，无需 keepalived）。
# ----------------------------------------------------------------------------
