# ============================================================================
# moss LB — Phase A: Nginx active/passive
# ============================================================================
# 统一入口 + TLS 终止（示例为明文 80，见文末 TLS 注释）+ HTTP/WS/SSE 反向代理
# + 主备故障切换。主实例 moss-server-a 承接全部流量，moss-server-b 仅在 a 不可用
# 时（backup）接管新流量。
#
# 与源设计文档第 6 节底稿的差异（均为基于 moss 代码事实的修正）：
#   1. 补齐 cabin SSE 两个 location（/v1/ai-chat/send、/v1/voice-chat/send）——
#      底稿仅覆盖 build-events / mcp/events，遗漏 cabin 流式端点。
#   2. 显式 `proxy_next_upstream error timeout http_503;`——nginx 默认失败判定
#      只含 error/timeout，HTTP 503 不计入 max_fails；draining 实例靠返回 503
#      被摘流，必须显式把 503 纳入失败判定。
#
# 摘流机制（重要，务必理解）：开源 nginx 无主动健康检查。draining 实例（收到
# SIGTERM 后 /readyz 返回 503、业务端点仍返回 503 的故障端点）依赖“被动失败计数”
# 被摘除：累计 max_fails=3 次失败后，在 fail_timeout=10s 窗口内该 upstream 被标记
# 不可用。因此 HA 部署需要存在 /readyz 轮询方（外部监控或运维脚本）持续产生请求，
# 摘流才能在 drain 窗口内生效；无轮询方时，drain 摘流退化为“进程退出后连接失败摘流”
# （fail_timeout 窗口内）。详见 README-ha.md。
#
# 业务 503 误摘流评估（moss 自身返回 503 的端点）：auth_proxy_unavailable、
# user_config_unavailable 均为实例功能真实故障信号，10s 内 3 次即摘 10s，摘流方向
# 正确。特例：/admin 若部署了未构建 admin 的错误镜像会返回 503，浏览器并发加载静态
# 资源易在短时间累计 ≥3 次把整实例摘除 10s（“部分功能缺失放大为整实例摘除”）——
# 该场景仅在部署错误镜像时出现。
# ----------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream moss_backend {
    # 主实例；被动失败计数：3 次失败后摘 10s。
    server moss-server-a:43127 max_fails=3 fail_timeout=10s;
    # 备实例：仅当 moss-server-a 不可用时接流量。
    server moss-server-b:43127 backup;
    keepalive 64;
}

# 企微回调专用 upstream：回调 server 监听独立端口 43128（主端口无回调路由，
# 不得复用 moss_backend——会 404）。无状态（每次请求从共享 DB 读配置），主备
# 语义与主端口一致。不启用企微回调可不暴露该端口（compose 侧同理）。
upstream moss_callback {
    server moss-server-a:43128 max_fails=3 fail_timeout=10s;
    server moss-server-b:43128 backup;
    keepalive 16;
}

# 企微回调入口：独立 listen 43128，企微管理后台的回调 URL 填
# http://<LB>:43128/api/v1/corp-apps/callback/<id>。GET 验签回显 + POST 事件入库。
server {
    listen 43128;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://moss_callback;
    }
}

server {
    listen 80;
    server_name moss.example.com;

    # 大文件上传（>100MB）不被默认 body size 限制拦截。
    client_max_body_size 1024m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 把 HTTP 503 计入 max_fails，使 draining 实例被摘流。
    # 注意：POST 等 non-idempotent 请求默认不重试（nginx 文档明示）；不重试请求的
    # 失败是否计入 max_fails 属实测项（详见 README-ha.md T4-③）。
    proxy_next_upstream error timeout http_503;

    # liveness（进程活着即 200，不参与 readiness 判定）。
    location = /healthz {
        proxy_pass http://moss_backend;
    }

    # readiness（draining 时返回 503，作为 LB 摘流依据）。
    location = /readyz {
        proxy_pass http://moss_backend;
    }

    # WebSocket：/ws/sessions/:sessionId
    location /ws/ {
        proxy_pass http://moss_backend;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SSE：wiki build events（GET /api/v1/wikis/:wikiId/build-events）
    location ~ ^/api/v1/.*/build-events$ {
        proxy_pass http://moss_backend;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：MCP events（GET /api/v1/mcp/events）
    location /api/v1/mcp/events {
        proxy_pass http://moss_backend;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：cabin AI chat 流式（POST /v1/ai-chat/send）——前缀 /v1/ 不带 /api。
    location = /v1/ai-chat/send {
        proxy_pass http://moss_backend;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：cabin voice chat 流式（POST /v1/voice-chat/send）。
    location = /v1/voice-chat/send {
        proxy_pass http://moss_backend;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://moss_backend;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ----------------------------------------------------------------------------
# cookie 名一致性约束：
#   本 conf 的被动摘流不依赖 cookie，无 map $cookie_moss_route（Phase A 不做粘滞）。
#   但若切到 Phase B（moss-sticky-active-active.conf），nginx `map $cookie_moss_route`
#   与 moss 的 MOSS_ROUTE_COOKIE_NAME 必须同名；改名会使 sticky 静默退化为 pool。
#
# TLS（生产启用）：本示例为 `listen 80`（明文）。生产启用 TLS 的方式：
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   并在 moss 侧设置 MOSS_ROUTE_COOKIE_SECURE=true（Phase B 时）。
#   证书经卷挂载进 nginx 容器。切勿把本明文示例直接当生产用。
# ----------------------------------------------------------------------------
