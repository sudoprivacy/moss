# ============================================================================
# moss LB — Phase B: Nginx sticky active-active
# ============================================================================
# 多实例同时接流量，同一浏览器凭 moss_route cookie 尽量固定到同一实例。moss-server
# 在响应中设置 `moss_route=<MOSS_INSTANCE_ID>`（HttpOnly/SameSite=Lax，见服务端
# setRouteCookieHeader）；nginx 按该 cookie 路由。无 cookie 的流量走 least_conn 池。
#
# 受限部署形态（务必理解）：Phase B sticky 双活运行在共享 SQLite 上。源设计文档
# 14.2 明文“SQLite 不建议作为生产 active-active DB”。本形态为受限部署，并发写能力
# 以前置实测 T1 结果为准；生产级 active-active 依赖已剔除的 Phase C（PostgreSQL）。
#
# 与源设计文档第 7 节底稿的差异（基于 nginx 官方文档 + moss 代码事实）：
#   1. 补齐 cabin SSE 两个 location（/v1/ai-chat/send、/v1/voice-chat/send）。
#   2. 显式 `proxy_next_upstream error timeout http_503;`（503 计入失败判定）。
#   3. 单 server 组的 max_fails/fail_timeout 是“写了但不生效的参数”——nginx 官方
#      文档原文：“If there is only a single server in a group, max_fails,
#      fail_timeout and slow_start parameters are ignored, and such a server
#      will never be considered unavailable.” 因此 moss_a / moss_b 组内的
#      max_fails/fail_timeout 已去掉，避免误导运维以为粘滞目标也有摘流。
#   4. 新增精确 `location = /readyz`（显式走 moss_pool）——见文末“摘流路径”说明。
#
# 摘流路径（关键差异，勿从 active/passive 平移理解）：
#   - 带 moss_route cookie 的流量命中单 server 组（moss_a / moss_b）：不参与失败
#     计数，响应原样透传。drain 窗口内业务请求正常 200（drain 只影响 /readyz）；
#     实例退出后该 cookie 流量得 502（map 直指单实例，无自动 fallback）。
#   - 503 摘流计数“仅经 moss_pool 组（无 cookie 流量）生效”。因此 /readyz 轮询方
#     【不得携带 moss_route cookie】，否则命中单 server 组、503 被透传不计数。
#   - least_conn 下无 cookie 的 /readyz 轮询分摊到 a/b 两台，draining 实例失败计数
#     积累速度约为轮询频率的一半，摘流速度依赖轮询频率。
# ----------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 单 server 组：粘滞目标。max_fails/fail_timeout 对单 server 组被 nginx 忽略，
# 故此处不写（写了也不生效）。
upstream moss_a {
    server moss-server-a:43127;
    keepalive 32;
}

upstream moss_b {
    server moss-server-b:43127;
    keepalive 32;
}

# 无 cookie 流量池：这里的 max_fails/fail_timeout 生效（组内多 server），503 摘流
# 仅经此组产生作用。
upstream moss_pool {
    least_conn;
    server moss-server-a:43127 max_fails=3 fail_timeout=10s;
    server moss-server-b:43127 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 企微回调专用 upstream：回调 server 监听独立端口 43128（主端口无回调路由，
# 不得复用主端口 upstream——会 404）。无状态（每次请求从共享 DB 读配置）；企微
# 服务器不带 cookie，直连 pool 轮询即可（也避开单 server 组死亡实例 502 无
# fallback 的已知限制）。不启用企微回调可不暴露该端口（compose 侧同理）。
upstream moss_callback {
    least_conn;
    server moss-server-a:43128 max_fails=3 fail_timeout=10s;
    server moss-server-b:43128 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# 企微回调入口：独立 listen 43128，企微管理后台的回调 URL 填
# http://<LB>:43128/api/v1/corp-apps/callback/<id>。GET 验签回显 + POST 事件入库。
server {
    listen 43128;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://moss_callback;
    }
}

# cookie 值 → upstream（浏览器粘滞兜底层）。cookie 名 moss_route 必须与 moss 的
# MOSS_ROUTE_COOKIE_NAME 一致；cookie 值 a/b 必须与各实例 MOSS_INSTANCE_ID 一致，
# 否则粘滞静默退化为 pool。
map $cookie_moss_route $moss_cookie_upstream {
    default moss_pool;
    a       moss_a;
    b       moss_b;
}

# ws_url 的 ?moss_route=<live owner>（服务端 owner-aware 下发，见 wsRouteHint/
# buildWsUrl）优先于 cookie：failover 后 owner 变更/实例死亡时 cookie 可能仍指向
# 旧实例。query 缺失或未知值时回落 cookie 结果（两段 map 组合，值含变量的 map 需
# nginx >= 1.11，compose 钉 1.27 满足）。query 参数名同样必须等于
# MOSS_ROUTE_COOKIE_NAME，且键值（a/b）必须与 MOSS_INSTANCE_ID / cookie map 一致。
# 作用范围：无 cookie 的桌面端（Electron 裸 fetch/ws 不回传 cookie）由此获得确定性
# owner 路由；REST/SSE 无实例亲和落 pool 即可。
map $arg_moss_route $moss_upstream {
    default $moss_cookie_upstream;
    a       moss_a;
    b       moss_b;
}

server {
    listen 80;
    server_name moss.example.com;

    client_max_body_size 1024m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 503 计入失败判定（仅对 moss_pool 组有意义，单 server 组忽略）。
    proxy_next_upstream error timeout http_503;

    location = /healthz {
        proxy_pass http://$moss_upstream;
    }

    # /readyz 显式走无 cookie 池，使 draining 实例的 503 计入 moss_pool 的失败计数。
    # 轮询方【不得携带 moss_route cookie】——携带会命中单 server 组、503 被透传不计数。
    location = /readyz {
        proxy_pass http://moss_pool;
    }

    # WebSocket：/ws/sessions/:sessionId
    location /ws/ {
        proxy_pass http://$moss_upstream;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SSE：wiki build events
    location ~ ^/api/v1/.*/build-events$ {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：MCP events
    location /api/v1/mcp/events {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：cabin AI chat 流式（POST /v1/ai-chat/send）。
    location = /v1/ai-chat/send {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SSE：cabin voice chat 流式（POST /v1/voice-chat/send）。
    location = /v1/voice-chat/send {
        proxy_pass http://$moss_upstream;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://$moss_upstream;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ----------------------------------------------------------------------------
# 注意（源文档第 7 节“注意”事项）：
#   - $moss_upstream 使用变量时，需确认 nginx 版本与 DNS 解析策略。Docker Compose
#     场景下服务名解析通常足够。
#   - K8s 场景更推荐 Ingress affinity（见 deploy/k8s/moss-ingress.yaml）或
#     Service + StatefulSet/headless service 组合，而非本 conf。
#
# Phase B 滚动重启窗口（已知限制）：实例从退出到重新就绪期间，携带该实例
# moss_route cookie 的请求得到 502（无自动 fallback），且 502 不清除浏览器 cookie，
# 用户持续 502 直至该实例恢复。桌面客户端（Electron）已具备 owner-aware 首连自愈
# （服务端 ws_url 携带 ?moss_route=<owner> + 客户端有界重试，见 README-ha）；admin
# web 无 WS 客户端（仅 EventSource SSE），经浏览器 cookie sticky 覆盖。
#
# TLS：同 active/passive conf 文末说明；HTTPS 下设 MOSS_ROUTE_COOKIE_SECURE=true。
# ----------------------------------------------------------------------------
