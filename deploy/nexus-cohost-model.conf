# Install as a drop-in for the co-host service and adjust the operator paths.
# Bundle scripts/e2e/cohost-model-bootstrap.ts for Node before enabling this.
# The service WorkingDirectory must contain the VFS client's complete proto tree
# at node_modules/@nexus-ai-fs/vfs-client/proto.
# Provider credentials belong in the daemon's private EnvironmentFile.
[Service]
TimeoutStartSec=120
ExecStartPost=/usr/bin/node /opt/nexus-cohost/model-bootstrap.mjs 127.0.0.1:8444 /opt/nexus-cohost/data/tls https://hk.sudorouter.ai /opt/nexus-cohost/model-cache
