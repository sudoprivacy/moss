# ============================================================================
# moss LB — K8s Ingress（可选 TLS 前置；cookie affinity 为简化备选形态）
# ============================================================================
# 【HA 首选方案已迁移】完整的 K8s 多副本 HA 不走本 Ingress 直连 Service 的形态：
#   部署 moss-server-statefulset.yaml + moss-nginx-route.yaml + moss-nexus.yaml。
#   原因：ingress-nginx 不支持按 query 参数路由到特定 pod，而 moss 的 WS owner
#   精确路由依赖 ?moss_route=<MOSS_INSTANCE_ID>（StatefulSet pod name）。入口层
#   由独立 nginx Deployment（两级 map，upstream 指向 headless pod DNS）承担。
#
# 本文件的两个用途：
#   1. 【首选形态的可选 TLS 前置】：backend 改指 moss-nginx Service（80），本
#      Ingress 只做 TLS 终止与域名收敛（annotation 保留 WS/SSE/body-size）。
#      此时【删除】affinity 相关 annotation——路由粘滞由 moss-nginx 的两级 map
#      完成，ingress 再做 affinity 会与之互斥（同名 cookie 互相覆盖）。
#   2. 【简化备选（非完整 HA）】：单副本或允许 WS 409 重连风暴的场景，可保留
#      下方 cookie affinity 直连 moss-server-headless。适用前提仍是 moss 【不配】
#      MOSS_INSTANCE_ID（affinity cookie 与 moss 自设 route cookie 同名互斥，
#      见 setRouteCookieHeader），因此该备选没有 owner 路由/fencing 语义，
#      不作为 HA 交付形态。
#
# Deployment vs StatefulSet（源文档 12.2）：HA（owner-aware + fencing）必须
# StatefulSet + headless service（实例 id 稳定 = pod name）。
# ----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moss-server
  namespace: moss-control
  annotations:
    # cookie affinity：同一浏览器固定到同一后端 pod。
    nginx.ingress.kubernetes.io/affinity: "cookie"
    # 该 cookie 名与 moss route cookie 同名互斥（见文件头第 3 点）。
    nginx.ingress.kubernetes.io/session-cookie-name: "moss_route"
    nginx.ingress.kubernetes.io/session-cookie-path: "/"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    # WS/SSE 长连接超时。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # SSE 不缓冲。
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # 大文件上传。
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
spec:
  ingressClassName: nginx
  rules:
    - host: moss.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moss-server
                port:
                  number: 43127
