# ============================================================================
# moss HA — K8s 入口路由 nginx（P3-2）
# ============================================================================
# 为什么是独立 nginx Deployment 而非 Ingress 直连：ingress-nginx 不支持按 query
# 参数（?moss_route=<owner>）路由到特定 pod，moss 的 WS owner 精确路由依赖它。
# 本 nginx 复用跨主机形态的两级 map（query > cookie > pool），upstream 直接指向
# StatefulSet 各 pod 的稳定 DNS（moss-server-<i>.moss-server-headless.<ns>.svc）。
# Ingress 可选作为 TLS 前置挂在本 Service 前（moss-ingress.yaml 的更新说明）。
#
# 【扩缩容同步义务】replicas 或 pod 名单变化时：同步下方 ConfigMap 的 upstream 三
# 组与两级 map 的键（键 == pod name == MOSS_INSTANCE_ID），滚动重启本 Deployment。
# 例中 replicas=2（moss-server-0/1）。
# ----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: moss-nginx-conf
  namespace: moss-control
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream moss_p0 {
        server moss-server-0.moss-server-headless.moss-control.svc:43127;
        keepalive 32;
    }
    upstream moss_p1 {
        server moss-server-1.moss-server-headless.moss-control.svc:43127;
        keepalive 32;
    }
    upstream moss_pool {
        least_conn;
        server moss-server-0.moss-server-headless.moss-control.svc:43127 max_fails=3 fail_timeout=10s;
        server moss-server-1.moss-server-headless.moss-control.svc:43127 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }
    upstream moss_callback {
        least_conn;
        server moss-server-0.moss-server-headless.moss-control.svc:43128 max_fails=3 fail_timeout=10s;
        server moss-server-1.moss-server-headless.moss-control.svc:43128 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # 键 == pod name == MOSS_INSTANCE_ID（fieldRef metadata.name 注入）。
    map $cookie_moss_route $moss_cookie_upstream {
        default        moss_pool;
        moss-server-0  moss_p0;
        moss-server-1  moss_p1;
    }
    map $arg_moss_route $moss_upstream {
        default        $moss_cookie_upstream;
        moss-server-0  moss_p0;
        moss-server-1  moss_p1;
    }

    server {
        listen 43128;
        server_name _;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        location / {
            proxy_pass http://moss_callback;
        }
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1024m;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_503;

        location = /healthz { proxy_pass http://$moss_upstream; }
        # 摘流探测走 pool（不带 moss_route cookie）。
        location = /readyz  { proxy_pass http://moss_pool; }

        location /ws/ {
            proxy_pass http://$moss_upstream;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location ~ ^/api/v1/.*/build-events$ {
            proxy_pass http://$moss_upstream;
            proxy_buffering off; proxy_cache off;
            proxy_read_timeout 3600s; proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
        location /api/v1/mcp/events {
            proxy_pass http://$moss_upstream;
            proxy_buffering off; proxy_cache off;
            proxy_read_timeout 3600s; proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
        location = /v1/ai-chat/send {
            proxy_pass http://$moss_upstream;
            proxy_buffering off; proxy_cache off;
            proxy_read_timeout 3600s; proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
        location = /v1/voice-chat/send {
            proxy_pass http://$moss_upstream;
            proxy_buffering off; proxy_cache off;
            proxy_read_timeout 3600s; proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }
        location / {
            proxy_pass http://$moss_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moss-nginx
  namespace: moss-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moss-nginx
  template:
    metadata:
      labels:
        app: moss-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
            - containerPort: 43128
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: moss-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: moss-nginx
  namespace: moss-control
spec:
  selector:
    app: moss-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: callback
      port: 43128
      targetPort: 43128
